allowBuilds:
  '@anthropic-ai/claude-code': true
  '@google/genai': true
  # Kimi Code selects its integrity-locked native payload during postinstall.
  '@moonshot-ai/kimi-code': true
  # Qwen Code loads its pinned native audio addon when voice input is used.
  # The package and its transitive artifacts are integrity-locked below, so
  # permit the install script instead of leaving pnpm's interactive placeholder.
  '@qwen-code/audio-capture': true
  '@vscode/vsce-sign': true
  canvas: true
  # electron + playwright: the desktop recording lane (web/electron/e2e/) needs
  # their postinstall scripts to run — electron downloads its ~100MB runtime
  # binary and playwright its driver. Without these, `pnpm install` in the
  # electron package "succeeds" but leaves the binaries absent, so the lane
  # can't launch. Dev/test only (both are web/electron devDependencies; not
  # bundled into the shipped app).
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  msw: true
  # Kimi Code's interactive terminal bridge requires its integrity-locked PTY
  # native addon; without the build the package installs but the TUI cannot run.
  node-pty: true
  # The pinned OpenCode wrapper selects the integrity-locked platform binary in
  # postinstall. Without this, the CLI package is present but `opencode` cannot
  # start in the Host image.
  opencode-ai: true
  playwright: true
  protobufjs: true
  sharp: true
  workerd: true

auditConfig: {}
patchedDependencies:
  '@tiptap/react@3.31.4': patches/@tiptap__react@3.31.4.patch
