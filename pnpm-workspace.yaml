packages:
  - 'web'
  - 'web/electron'
  - '.github/ci-deps'
  - 'editors/vscode'
  - 'deploy/cloudflare'
  - 'sdks/web-extension'
  - 'examples/extensions/hello-page/web'

# 7-day dependency cooldown, mirroring the Python-side exclude-newer = "P7D" in uv.toml.
minimumReleaseAge: 10080

# These exact, integrity-locked Harness artifacts were admitted with the CLI
# fleet update. Keep the exception version-scoped so later releases still wait
# for the full cooldown; remove entries after their seven-day window has elapsed.
minimumReleaseAgeExclude:
  # Security-only exception: supersedes the vulnerable <=4.2.0 line. The
  # exact artifact remains integrity-locked and policy-verified.
  - 'http-cache-semantics@4.3.0'
  # Security-only exception: fixes GHSA-68fv-2mgg-jv7q. The exact artifact is
  # integrity-locked in pnpm-lock.yaml and remains subject to lockfile policy.
  - 'source-map-js@1.2.2'
  # Security-only exception: fixes MCP OAuth credential redirection and
  # cross-session task exposure (GHSA-6qxp-vccf-f47h, GHSA-22jm-h49p-29qw).
  - '@modelcontextprotocol/sdk@1.32.0'
  - '@moonshot-ai/kimi-code@0.43.1'
  - '@qwen-code/audio-capture@0.23.4'
  - '@qwen-code/qwen-code@0.23.4'
  - 'opencode-ai@1.18.31'
  - 'opencode-darwin-arm64@1.18.31'
  - 'opencode-darwin-x64-baseline@1.18.31'
  - 'opencode-darwin-x64@1.18.31'
  - 'opencode-linux-arm64-musl@1.18.31'
  - 'opencode-linux-arm64@1.18.31'
  - 'opencode-linux-x64-baseline-musl@1.18.31'
  - 'opencode-linux-x64-baseline@1.18.31'
  - 'opencode-linux-x64-musl@1.18.31'
  - 'opencode-linux-x64@1.18.31'
  - 'opencode-windows-arm64@1.18.31'
  - 'opencode-windows-x64-baseline@1.18.31'
  - 'opencode-windows-x64@1.18.31'

autoInstallPeers: false
strictPeerDependencies: false

# jest-dom doesn't declare vitest as a (peer) dependency, so under pnpm's store
# layout its `declare module "vitest"` matcher-type augmentation can't resolve
# vitest and silently fails to merge — `tsc` then loses every DOM matcher
# (toBeInTheDocument, toHaveClass, …) though they work at runtime. Re-enable the
# peer so the augmentation resolves. Drop once jest-dom ships the peer upstream.
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'

catalog:
  react: ^18.2.0
  react-dom: ^18.2.0
  shiki: 4.2.0

