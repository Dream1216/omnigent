name: Build reproducible OCI candidate
description: Build one application or LiteLLM OCI archive with pinned release materials.

inputs:
  artifact:
    description: Archive basename, server, host, or litellm.
    required: true
  target:
    description: Dockerfile target paired with the artifact.
    required: true
  attempt:
    description: Reproducibility attempt number, either 1 or 2.
    required: true

runs:
  using: composite
  steps:
    - name: Validate build coordinates
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        TARGET: ${{ inputs.target }}
        ATTEMPT: ${{ inputs.attempt }}
      run: |
        set -euo pipefail
        case "${ARTIFACT}:${TARGET}" in
          server:runtime|host:host|litellm:runtime) ;;
          *) echo "unsupported OCI artifact/target pair" >&2; exit 2 ;;
        esac
        case "${ATTEMPT}" in
          1|2) ;;
          *) echo "attempt must be 1 or 2" >&2; exit 2 ;;
        esac
        for name in PYTHON_IMAGE RUNTIME_IMAGE NODE_IMAGE GO_IMAGE \
          SOURCE_DATE_EPOCH SOURCE_REVISION \
          UPSTREAM_REVISION CONTROL_PLANE_SCHEMA_REVISION ADAPTER_CONTRACT_VERSION; do
          [[ -n "${!name:-}" ]] || { echo "missing build material: ${name}" >&2; exit 2; }
        done
        if [[ "$ARTIFACT" == litellm ]]; then
          expected=$(jq -er .image saas/production/litellm_release.json)
          [[ "${LITELLM_BASE_IMAGE:-}" == "$expected" ]] || exit 2
        fi

    - name: Build ${{ inputs.artifact }} candidate attempt ${{ inputs.attempt }}
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: .
        file: ${{ inputs.artifact == 'litellm' && 'saas/deployment/litellm/Dockerfile' || 'deploy/docker/Dockerfile' }}
        target: ${{ inputs.target }}
        push: false
        platforms: linux/amd64,linux/arm64
        outputs: type=oci,dest=${{ runner.temp }}/${{ inputs.artifact }}-${{ inputs.attempt }}.tar,rewrite-timestamp=true
        provenance: mode=max
        sbom: true
        no-cache: ${{ inputs.attempt == '2' }}
        cache-from: ${{ inputs.attempt == '1' && format('type=gha,scope=saas-{0}-candidate', inputs.artifact) || '' }}
        cache-to: ${{ inputs.attempt == '1' && format('type=gha,scope=saas-{0}-candidate,mode=max', inputs.artifact) || '' }}
        build-args: |
          PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
          RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
          NODE_IMAGE=${{ env.NODE_IMAGE }}
          GO_IMAGE=${{ env.GO_IMAGE }}
          SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
          CONTROL_PLANE_SCHEMA_REVISION=${{ env.CONTROL_PLANE_SCHEMA_REVISION }}
          ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
          VITE_OMNIGENT_HOST_ROUTING=true
          LITELLM_BASE_IMAGE=${{ env.LITELLM_BASE_IMAGE }}
          OMNIGENT_EXTRAS=${{ inputs.artifact == 'server' && 'kubernetes' || '' }}
          EXTRA_HARNESS_CLIS=${{ inputs.artifact == 'host' && 'jcode@0.90.1 devin@3000.11.3' || '' }}
