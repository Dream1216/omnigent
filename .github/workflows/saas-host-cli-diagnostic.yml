name: SaaS Host CLI diagnostic

on:
  push:
    branches:
      - codex/next-host-cli-diagnose-20261006

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compare independent pinned CLI installs
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/docker/install-harness-cli.sh /tmp/install-harness-cli.sh
          cp saas/scripts/install-saas-harness-cli.sh /tmp/install-saas-harness-cli.sh
          cp saas/scripts/normalize_host_cli_tree.py /tmp/normalize_host_cli_tree.py
          cat > /tmp/host-cli-entry-manifest.py <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          for root in (Path('/opt/jcode'), Path('/opt/devin')):
              for path in [root, *sorted(root.rglob('*'))]:
                  info = path.stat(follow_symlinks=False)
                  if stat.S_ISREG(info.st_mode):
                      content = hashlib.sha256(path.read_bytes()).hexdigest()
                  elif stat.S_ISLNK(info.st_mode):
                      content = 'link:' + os.readlink(path)
                  else:
                      content = '-'
                  print(f'{path}\t{stat.S_IMODE(info.st_mode):o}\t{info.st_uid}:{info.st_gid}\t{info.st_size}\t{info.st_mtime_ns}\t{content}')
          PY
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          for attempt in 1 2; do
            sudo rm -rf /opt/jcode /opt/devin /usr/local/bin/jcode /usr/local/bin/devin
            sudo env SOURCE_DATE_EPOCH="$source_date_epoch" PATH=/usr/local/bin:/usr/bin:/bin \
              bash /tmp/install-saas-harness-cli.sh jcode@0.90.1 devin@3000.11.3
            sudo python3 /tmp/host-cli-entry-manifest.py > "/tmp/host-cli-attempt-${attempt}.txt"
          done
          if diff -u /tmp/host-cli-attempt-1.txt /tmp/host-cli-attempt-2.txt; then
            echo 'Pinned Host CLI installs have identical retained files and metadata.'
          else
            echo 'Pinned Host CLI installs differ; inspect the paths above.'
            exit 1
          fi
