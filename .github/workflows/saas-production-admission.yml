name: SaaS production admission

on:
  workflow_dispatch:
    inputs:
      product_revision:
        description: Exact 40-character product candidate SHA
        required: true
        type: string
      evidence_revision:
        description: Exact 40-character evidence-only revision SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: saas-production-admission-${{ inputs.product_revision }}
  cancel-in-progress: false

jobs:
  production-admission:
    environment: production-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable revision inputs
        shell: bash
        env:
          PRODUCT_REVISION: ${{ inputs.product_revision }}
          EVIDENCE_REVISION: ${{ inputs.evidence_revision }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REF_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_REF" == "refs/heads/main" ]]
          [[ "$EVIDENCE_REVISION" == "$TRUSTED_REF_REVISION" ]]
      - name: Checkout exact evidence revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.evidence_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install locked production verifier dependencies
        run: uv sync --frozen --extra saas
      - name: Enforce final production admission
        env:
          PRODUCT_REVISION: ${{ inputs.product_revision }}
          EVIDENCE_REVISION: ${{ inputs.evidence_revision }}
        run: >-
          uv run python -m saas.scripts.run_production_admission
          --product-revision "$PRODUCT_REVISION"
          --evidence-revision "$EVIDENCE_REVISION"
          --output-directory artifacts/production-admission
          --require-ready
      - name: Upload immutable admission reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-admission-${{ inputs.evidence_revision }}
          path: artifacts/production-admission
          if-no-files-found: error
          retention-days: 90
