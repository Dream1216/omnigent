name: SaaS production admission

on:
  workflow_dispatch:
    inputs:
      product_revision:
        description: Exact 40-character product candidate SHA
        required: true
        type: string
      evidence_revision:
        description: Exact captured protected Main controller SHA
        required: true
        type: string
      review_exception_request_json:
        description: Optional canonical sole-owner authorization request; never waives technical gates
        type: string
      receipt_request_json:
        description: Optional canonical receipt request JSON; empty runs final admission
      runtime_evidence_revision:
        description: Optional immutable evidence-only data revision for receipt or final admission
        required: false
        type: string
      receipt_product:
        description: Original current product or the exact registered Compatibility018 receipt subject
        required: false
        type: choice
        default: current
        options: [current, Compatibility018]

permissions: {contents: read, actions: read}

concurrency:
  group: saas-production-admission-${{ inputs.product_revision }}
  cancel-in-progress: false

jobs:
  production-admission:
    environment: production-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      packages: read
      attestations: read
    env:
      EVIDENCE_REVISION: ${{ inputs.evidence_revision }}
      PRODUCT_REVISION: ${{ inputs.product_revision }}
      REVIEW_EXCEPTION_REQUEST_JSON: ${{ inputs.review_exception_request_json }}
      RECEIPT_REQUEST_JSON: ${{ inputs.receipt_request_json }}
      RUNTIME_EVIDENCE_REVISION: ${{ inputs.runtime_evidence_revision }}
      RECEIPT_PRODUCT: ${{ inputs.receipt_product || 'current' }}
      TRUSTED_REF: ${{ github.ref }}
      TRUSTED_REF_REVISION: ${{ github.sha }}
      WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable revision inputs
        run: |
          set -euo pipefail
          [[ "$PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]] && [[ "$EVIDENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$REVIEW_EXCEPTION_REQUEST_JSON" || -z "$RECEIPT_REQUEST_JSON" ]]
          [[ -z "$RUNTIME_EVIDENCE_REVISION" || -z "$REVIEW_EXCEPTION_REQUEST_JSON" ]]
          [[ "$TRUSTED_REF" == "refs/heads/main" ]] && [[ "$EVIDENCE_REVISION" == "$TRUSTED_REF_REVISION" ]]
          case "$RECEIPT_PRODUCT" in
            current) ;;
            Compatibility018)
              [[ -n "$RECEIPT_REQUEST_JSON" && "$RUNTIME_EVIDENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen --extra saas
      - name: Checkout registered compatibility receipt subject without executing it
        if: inputs.receipt_product == 'Compatibility018'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.product_revision }}
          path: receipt-product
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare separate immutable evidence data
        if: inputs.runtime_evidence_revision != '' && inputs.review_exception_request_json == ''
        uses: ./saas/actions/runtime-evidence-context
        with:
          product-revision: ${{ inputs.product_revision }}
          evidence-revision: ${{ inputs.runtime_evidence_revision }}
          registered-product-repo: ${{ inputs.receipt_product == 'Compatibility018' && format('{0}/receipt-product', github.workspace) || '' }}
      - if: inputs.review_exception_request_json != ''
        run: >-
          uv run python -m saas.scripts.prepare_review_exception
          --authorization-request-json "$REVIEW_EXCEPTION_REQUEST_JSON"
          --product-revision "$PRODUCT_REVISION"
          --evidence-revision "$EVIDENCE_REVISION"
          --workflow-identity "$WORKFLOW_IDENTITY"
      - name: Set up read-only registry verification
        if: inputs.receipt_request_json == '' && inputs.review_exception_request_json == ''
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Authenticate registry reads
        if: inputs.receipt_request_json == '' && inputs.review_exception_request_json == ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.receipt_request_json == '' && inputs.review_exception_request_json == ''
        run: >-
          uv run python .github/scripts/ci/release_pipeline.py gate --stage production
          --product-revision "$PRODUCT_REVISION"
          --controller-revision "$TRUSTED_REF_REVISION"
          --evidence-revision "${RUNTIME_EVIDENCE_REVISION:-$EVIDENCE_REVISION}"
          --evidence-repo "${OMNIGENT_RUNTIME_EVIDENCE_REPO:-$GITHUB_WORKSPACE}"
          --output-directory artifacts/production-admission
          --require-ready
      - if: inputs.receipt_request_json != ''
        run: |
          set -euo pipefail
          subject_args=()
          if [[ "$RECEIPT_PRODUCT" == "Compatibility018" ]]; then
            subject_args+=(--registered-product-repo "$GITHUB_WORKSPACE/receipt-product")
          fi
          uv run python -m saas.scripts.issue_evidence_receipt \
            --request-json "$RECEIPT_REQUEST_JSON" \
            --product-revision "$PRODUCT_REVISION" \
            --workflow-identity "$WORKFLOW_IDENTITY" \
            --output-directory artifacts/evidence-receipt \
            --evidence-repo "${OMNIGENT_RUNTIME_EVIDENCE_REPO:-$GITHUB_WORKSPACE}" \
            "${subject_args[@]}"
      - name: Upload immutable review authorization
        if: inputs.review_exception_request_json != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-review-authorization-${{ inputs.evidence_revision }}
          path: artifacts/review-exception/review-exception-authorization.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload immutable admission reports
        if: always() && inputs.review_exception_request_json == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-admission-${{ inputs.evidence_revision }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
