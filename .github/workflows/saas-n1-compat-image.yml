name: SaaS N-1 compatibility image

on:
  pull_request:
    paths:
      - ".github/workflows/saas-n1-compat-image.yml"
      - "deploy/docker/Dockerfile"
      - "saas/n1_compat/**"
      - "saas/scripts/build_n1_compat.py"
      - "saas/scripts/compare_oci_rebuilds.py"
      - "saas/control_plane/migrations/versions/p0s000000003_outbox_quarantine.py"
      - "saas/control_plane/postgresql_database.sql"
      - "saas/control_plane/postgresql_database.psql"
      - "saas/control_plane/postgresql_principals.sql"
      - "saas/control_plane/postgresql_principals.psql"
      - "saas/control_plane/postgresql_roles.sql"
      - "saas/control_plane/postgresql_roles.psql"
      - "saas/n1_outbox_admission.py"
      - "tests/saas/test_n1_compat_patch.py"
      - "tests/saas/test_n1_outbox_admission.py"
      - "tests/saas/test_control_plane_migration.py"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/saas-n1-compat-image.yml"
      - "deploy/docker/Dockerfile"
      - "saas/n1_compat/**"
      - "saas/scripts/build_n1_compat.py"
      - "saas/scripts/compare_oci_rebuilds.py"
      - "saas/control_plane/migrations/versions/p0s000000003_outbox_quarantine.py"
      - "saas/control_plane/postgresql_database.sql"
      - "saas/control_plane/postgresql_database.psql"
      - "saas/control_plane/postgresql_principals.sql"
      - "saas/control_plane/postgresql_principals.psql"
      - "saas/control_plane/postgresql_roles.sql"
      - "saas/control_plane/postgresql_roles.psql"
      - "saas/n1_outbox_admission.py"
      - "tests/saas/test_n1_compat_patch.py"
      - "tests/saas/test_n1_outbox_admission.py"
      - "tests/saas/test_control_plane_migration.py"
  workflow_dispatch:
    inputs:
      publish_signed:
        description: Publish the exact current main revision as a signed N-1 candidate
        required: true
        type: boolean
        default: false
      product_revision:
        description: Exact 40-character current main revision; required for publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: saas-n1-compat-image-${{ github.ref }}
  cancel-in-progress: false

env:
  N1_BASE_COMMIT: 9451a64c1affa06630b9105bf39b56bb89feba3b
  N1_CONTRACT_VERSION: p0s3-n1-outbox-security-compat-v1
  N1_PATCH_SHA256: 810d1ffdf97f46408b39eb81a56345bdf463c736bc19789c734c92ccfaffcc35
  N1_PATCHED_TREE_HASH: git-sha1:87e56c8f1b7669c2028c62cf537eac97f1e027ac
  N1_SCHEMA_REVISION: p0s000000003
  N1_IMAGE_NAME: omnigent-saas-n1-compat
  OMNIGENT_SKIP_WEB_UI: "true"

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNIGENT_SAAS_TEST_POSTGRES_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout immutable patch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Verify fixed source and manifest coordinates
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          jq -e \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            '.base_commit == $base and
             .contract_version == $contract and
             .patch_sha256 == $patch and
             .patched_tree_hash == $tree and
             .required_schema_revision == $schema and
             .artifact_admission == "external-signed-receipt-required" and
             .schema_change_policy.outbox_ddl_requires_worker_drain == true and
             .schema_change_policy.catalog_recheck_before_restart == true' \
            saas/n1_compat/manifest.json
          [[ "$(sha256sum saas/n1_compat/9451a64c1.patch | cut -d' ' -f1)" == "$N1_PATCH_SHA256" ]]
      - name: Install locked N and N-1 test dependencies
        run: uv sync --frozen --extra saas --group dev
      - name: Materialize the fixed N-1 patched source
        run: |
          set -euo pipefail
          uv run python -m saas.scripts.build_n1_compat \
            --repository . \
            --output-directory "${RUNNER_TEMP}/n1-source" \
            > artifacts-n1-builder.json
          jq -e \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            '.status == "verified" and
             .base_commit == $base and
             .contract_version == $contract and
             .patch_sha256 == $patch and
             .patched_tree_hash == $tree and
             .required_schema_revision == $schema and
             .schema_change_policy.outbox_ddl_requires_worker_drain == true and
             .schema_change_policy.catalog_recheck_before_restart == true and
             (.materialized_source | type == "string")' \
            artifacts-n1-builder.json
          test ! -e "${RUNNER_TEMP}/n1-source/.git"
      - name: Run N-1 patch and PostgreSQL p0s3 schema contracts
        run: |
          set -euo pipefail
          uv run pytest -q tests/saas/test_n1_compat_patch.py
          uv run pytest -q \
            tests/saas/test_control_plane_migration.py::test_real_postgresql_pinned_n1_outbox_compatibility_bridge \
            tests/saas/test_n1_outbox_admission.py::test_real_postgresql_n1_compat_login_admission_and_roles_replay
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Resolve immutable candidate materials
        run: |
          set -euo pipefail
          python_digest=$(crane digest python:3.12-slim)
          node_digest=$(crane digest node:22-slim)
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          upstream_revision=$(jq -r .upstream_revision "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          adapter_contract=$(jq -r .adapter_contract_version "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          printf '%s\n' "PYTHON_IMAGE=python:3.12-slim@${python_digest}" >> "$GITHUB_ENV"
          printf '%s\n' "NODE_IMAGE=node:22-slim@${node_digest}" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_DATE_EPOCH=${source_epoch}" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          printf '%s\n' "UPSTREAM_REVISION=${upstream_revision}" >> "$GITHUB_ENV"
          printf '%s\n' "ADAPTER_CONTRACT_VERSION=${adapter_contract}" >> "$GITHUB_ENV"
      - name: Build dual-platform N-1 runtime candidate attempt 1
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/n1-source
          file: ${{ runner.temp }}/n1-source/deploy/docker/Dockerfile
          target: n1-compat-runtime
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/n1-runtime-1.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=saas-n1-compat-candidate
          cache-to: type=gha,scope=saas-n1-compat-candidate,mode=max
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            CONTROL_PLANE_SCHEMA_REVISION=${{ env.N1_SCHEMA_REVISION }}
            ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
            N1_BASE_COMMIT=${{ env.N1_BASE_COMMIT }}
            N1_CONTRACT_VERSION=${{ env.N1_CONTRACT_VERSION }}
            N1_PATCH_SHA256=${{ env.N1_PATCH_SHA256 }}
            N1_PATCHED_TREE_HASH=${{ env.N1_PATCHED_TREE_HASH }}
      - name: Build dual-platform N-1 runtime candidate attempt 2
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/n1-source
          file: ${{ runner.temp }}/n1-source/deploy/docker/Dockerfile
          target: n1-compat-runtime
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/n1-runtime-2.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=saas-n1-compat-candidate
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            CONTROL_PLANE_SCHEMA_REVISION=${{ env.N1_SCHEMA_REVISION }}
            ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
            N1_BASE_COMMIT=${{ env.N1_BASE_COMMIT }}
            N1_CONTRACT_VERSION=${{ env.N1_CONTRACT_VERSION }}
            N1_PATCH_SHA256=${{ env.N1_PATCH_SHA256 }}
            N1_PATCHED_TREE_HASH=${{ env.N1_PATCHED_TREE_HASH }}
      - name: Compare repeated OCI runtime facts and record blocked evidence
        run: |
          set -euo pipefail
          uv run python -m saas.scripts.compare_oci_rebuilds \
            --image "${N1_IMAGE_NAME}=${RUNNER_TEMP}/n1-runtime-1.tar,${RUNNER_TEMP}/n1-runtime-2.tar" \
            --output artifacts/n1-compat-rebuild.json
          jq \
            --arg adapter "$ADAPTER_CONTRACT_VERSION" \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            --arg revision "$GITHUB_SHA" \
            --arg upstream "$UPSTREAM_REVISION" \
            '. + {
              evidence_kind: "n1_security_compat_oci_candidate",
              product_revision: $revision,
              patch_source_revision: $revision,
              base_commit: $base,
              contract_version: $contract,
              patch_sha256: $patch,
              patched_tree_hash: $tree,
              required_schema_revision: $schema,
              upstream_revision: $upstream,
              adapter_contract_version: $adapter,
              outbox_schema_change: {
                compat_worker_drain_required: true,
                catalog_recheck_before_restart: true
              },
              production_ready: false,
              external_hsm_receipt: null,
              vulnerability_scan: null,
              license_scan: null,
              canary: null,
              n_minus_one_rollback: null,
              production_receipt: null,
              production_blockers: [
                "external non-exportable KMS/HSM artifact Receipt is not attached",
                "vulnerability and license admission scans are not completed",
                "one-hour digest-pinned Canary is not completed",
                "900-second N-1 rollback exercise is not completed"
              ]
            }' artifacts/n1-compat-rebuild.json \
            > artifacts/n1-compat-candidate-evidence.json
          jq -e '.status == "pass" and .production_ready == false and .production_receipt == null' \
            artifacts/n1-compat-candidate-evidence.json
      - name: Upload blocked N-1 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n1-compat-candidate-${{ github.sha }}
          path: |
            artifacts-n1-builder.json
            artifacts/n1-compat-rebuild.json
            artifacts/n1-compat-candidate-evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_signed &&
      github.ref == 'refs/heads/main' &&
      inputs.product_revision == github.sha
    needs: verify-candidate
    environment: production-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PRODUCT_REVISION: ${{ inputs.product_revision }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/saas-n1-compat-image.yml
    steps:
      - name: Validate protected publication coordinates
        env:
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_REF" == "refs/heads/main" ]]
          [[ "$PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCT_REVISION" == "$TRUSTED_REVISION" ]]
      - name: Checkout exact patch-source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.product_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Materialize exact fixed N-1 source for publication
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRODUCT_REVISION" ]]
          uv sync --frozen --extra saas
          uv run python -m saas.scripts.build_n1_compat \
            --repository . \
            --output-directory "${RUNNER_TEMP}/n1-source" \
            > artifacts-n1-builder.json
          jq -e \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            '.status == "verified" and
             .base_commit == $base and
             .contract_version == $contract and
             .patch_sha256 == $patch and
             .patched_tree_hash == $tree and
             .required_schema_revision == $schema and
             .schema_change_policy.outbox_ddl_requires_worker_drain == true and
             .schema_change_policy.catalog_recheck_before_restart == true' \
            artifacts-n1-builder.json
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable publication materials
        id: release
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          python_digest=$(crane digest python:3.12-slim)
          node_digest=$(crane digest node:22-slim)
          source_epoch=$(git show -s --format=%ct "$PRODUCT_REVISION")
          upstream_revision=$(jq -r .upstream_revision "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          adapter_contract=$(jq -r .adapter_contract_version "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          echo "image=ghcr.io/${owner}/${N1_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${PRODUCT_REVISION}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "PYTHON_IMAGE=python:3.12-slim@${python_digest}" >> "$GITHUB_ENV"
          printf '%s\n' "NODE_IMAGE=node:22-slim@${node_digest}" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_DATE_EPOCH=${source_epoch}" >> "$GITHUB_ENV"
          printf '%s\n' "UPSTREAM_REVISION=${upstream_revision}" >> "$GITHUB_ENV"
          printf '%s\n' "ADAPTER_CONTRACT_VERSION=${adapter_contract}" >> "$GITHUB_ENV"
      - name: Build and publish independent N-1 compatibility digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/n1-source
          file: ${{ runner.temp }}/n1-source/deploy/docker/Dockerfile
          target: n1-compat-runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=saas-n1-compat-publish
          cache-to: type=gha,scope=saas-n1-compat-publish,mode=max
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ env.PRODUCT_REVISION }}
            UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            CONTROL_PLANE_SCHEMA_REVISION=${{ env.N1_SCHEMA_REVISION }}
            ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
            N1_BASE_COMMIT=${{ env.N1_BASE_COMMIT }}
            N1_CONTRACT_VERSION=${{ env.N1_CONTRACT_VERSION }}
            N1_PATCH_SHA256=${{ env.N1_PATCH_SHA256 }}
            N1_PATCHED_TREE_HASH=${{ env.N1_PATCHED_TREE_HASH }}
      - name: Attest published digest with GitHub OIDC
        id: attest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Immediately verify registry digest and attestation identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$(crane digest "${IMAGE}:${IMAGE_TAG}")" == "$IMAGE_DIGEST" ]]
          gh attestation verify "oci://${IMAGE}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref refs/heads/main \
            --source-digest "$PRODUCT_REVISION" \
            --deny-self-hosted-runners
      - name: Record signed but production-blocked publication facts
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg adapter "$ADAPTER_CONTRACT_VERSION" \
            --arg attestation "$ATTESTATION_URL" \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image "$IMAGE" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg revision "$PRODUCT_REVISION" \
            --arg schema "$N1_SCHEMA_REVISION" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg upstream "$UPSTREAM_REVISION" \
            '{
              schema_version: 1,
              evidence_kind: "signed_n1_security_compat_candidate",
              product_revision: $revision,
              patch_source_revision: $revision,
              base_commit: $base,
              contract_version: $contract,
              patch_sha256: $patch,
              patched_tree_hash: $tree,
              required_schema_revision: $schema,
              upstream_revision: $upstream,
              adapter_contract_version: $adapter,
              outbox_schema_change: {
                compat_worker_drain_required: true,
                catalog_recheck_before_restart: true
              },
              image: ($image + "@" + $digest),
              github_oidc_attestation: $attestation,
              external_hsm_receipt: null,
              vulnerability_scan: null,
              license_scan: null,
              canary: null,
              n_minus_one_rollback: null,
              production_receipt: null,
              production_ready: false,
              production_blockers: [
                "external non-exportable KMS/HSM artifact Receipt is not attached",
                "vulnerability and license admission scans are not completed",
                "one-hour digest-pinned Canary is not completed",
                "900-second N-1 rollback exercise is not completed"
              ]
            }' > artifacts/n1-compat-published-candidate.json
          jq -e '.production_ready == false and .production_receipt == null' \
            artifacts/n1-compat-published-candidate.json
      - name: Upload signed blocked publication facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-n1-compat-candidate-${{ inputs.product_revision }}
          path: |
            artifacts-n1-builder.json
            artifacts/n1-compat-published-candidate.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
