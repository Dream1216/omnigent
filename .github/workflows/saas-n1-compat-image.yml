name: SaaS N-1 compatibility image
run-name: >-
  SaaS N-1 ${{ github.event_name }}
  pr=${{ github.event.pull_request.number || 'none' }}
  base=${{ github.event.pull_request.base.sha || github.sha }}
  head=${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - ".github/actions/compat-smoke-saas-n1-gate/**"
      - ".github/workflows/saas-n1-merge-gate.yml"
      - ".github/workflows/saas-n1-compat-image.yml"
      - ".python-version"
      - ".uv/**"
      - ".venv/**"
      - "conftest.py"
      - "deploy/docker/Dockerfile"
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
      - "setup.py"
      - "tox.ini"
      - "uv.toml"
      - "uv.lock"
      - "saas/**"
      - "tests/conftest.py"
      - "tests/saas/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/actions/compat-smoke-saas-n1-gate/**"
      - ".github/workflows/saas-n1-merge-gate.yml"
      - ".github/workflows/saas-n1-compat-image.yml"
      - ".python-version"
      - ".uv/**"
      - ".venv/**"
      - "conftest.py"
      - "deploy/docker/Dockerfile"
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
      - "setup.py"
      - "tox.ini"
      - "uv.toml"
      - "uv.lock"
      - "saas/**"
      - "tests/conftest.py"
      - "tests/saas/**"
  workflow_dispatch:
    inputs:
      publish_signed:
        description: Publish the exact current main revision as a signed N-1 candidate
        required: true
        type: boolean
        default: false
      product_revision:
        description: Exact 40-character current main revision; required for publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: saas-n1-compat-image-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  N1_BUILDX_VERSION: v0.36.1
  N1_BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  N1_BASE_COMMIT: 9451a64c1affa06630b9105bf39b56bb89feba3b
  N1_CONTRACT_VERSION: p0s3-n1-outbox-security-compat-v1
  N1_PATCH_SHA256: a2bd67715c30998b6ca4eb309a27f664f3ed26c83a7d90f022dd33145682ce23
  N1_PATCHED_TREE_HASH: git-sha1:8a9f1e75a2eb85b3f17d8947491cea166d750e73
  N1_UV_IMAGE: ghcr.io/astral-sh/uv:0.12.1@sha256:cf4eedcaa81655197f625739489effcbe71b61ceb1506f332c3facae5deceded
  N1_SCHEMA_REVISION: p0s000000003
  N1_IMAGE_NAME: omnigent-saas-n1-compat
  OMNIGENT_SKIP_WEB_UI: "true"

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable patch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify fixed source and manifest coordinates
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
          jq -e \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            '.base_commit == $base and
             .contract_version == $contract and
             .patch_sha256 == $patch and
             .patched_tree_hash == $tree and
             .required_schema_revision == $schema and
             .artifact_admission == "external-signed-receipt-required" and
             .schema_change_policy.outbox_ddl_requires_worker_drain == true and
             .schema_change_policy.catalog_recheck_before_restart == true' \
            saas/n1_compat/manifest.json
          [[ "$(sha256sum saas/n1_compat/9451a64c1.patch | cut -d' ' -f1)" == "$N1_PATCH_SHA256" ]]
      - name: Materialize the fixed N-1 patched source
        run: |
          set -euo pipefail
          python -I -S saas/scripts/build_n1_compat.py \
            --repository . \
            --output-directory "${RUNNER_TEMP}/n1-source" \
            > artifacts-n1-builder.json
          jq -e \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            '.status == "verified" and
             .base_commit == $base and
             .contract_version == $contract and
             .patch_sha256 == $patch and
             .patched_tree_hash == $tree and
             .required_schema_revision == $schema and
             .schema_change_policy.outbox_ddl_requires_worker_drain == true and
             .schema_change_policy.catalog_recheck_before_restart == true and
             (.materialized_source | type == "string")' \
            artifacts-n1-builder.json
          test ! -e "${RUNNER_TEMP}/n1-source/.git"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: ${{ env.N1_BUILDX_VERSION }}
          driver-opts: image=${{ env.N1_BUILDKIT_IMAGE }}
      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Resolve immutable candidate materials
        run: |
          set -euo pipefail
          python_digest=$(crane digest python:3.12-slim)
          source_epoch=$(git show -s --format=%ct "$CANDIDATE_REVISION")
          upstream_revision=$(jq -r .upstream_revision "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          adapter_contract=$(jq -r .adapter_contract_version "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          printf '%s\n' "PYTHON_IMAGE=python:3.12-slim@${python_digest}" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_DATE_EPOCH=${source_epoch}" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_REVISION=${CANDIDATE_REVISION}" >> "$GITHUB_ENV"
          printf '%s\n' "UPSTREAM_REVISION=${upstream_revision}" >> "$GITHUB_ENV"
          printf '%s\n' "ADAPTER_CONTRACT_VERSION=${adapter_contract}" >> "$GITHUB_ENV"
      - name: Build dual-platform N-1 runtime candidate attempt 1
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/n1-source
          file: ${{ runner.temp }}/n1-source/saas/n1_compat/Dockerfile
          target: n1-compat-runtime
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/n1-runtime-1.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=saas-n1-compat-candidate
          cache-to: type=gha,scope=saas-n1-compat-candidate,mode=max
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            UV_IMAGE=${{ env.N1_UV_IMAGE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            CONTROL_PLANE_SCHEMA_REVISION=${{ env.N1_SCHEMA_REVISION }}
            ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
            N1_BASE_COMMIT=${{ env.N1_BASE_COMMIT }}
            N1_CONTRACT_VERSION=${{ env.N1_CONTRACT_VERSION }}
            N1_PATCH_SHA256=${{ env.N1_PATCH_SHA256 }}
            N1_PATCHED_TREE_HASH=${{ env.N1_PATCHED_TREE_HASH }}
      - name: Build dual-platform N-1 runtime candidate attempt 2
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/n1-source
          file: ${{ runner.temp }}/n1-source/saas/n1_compat/Dockerfile
          target: n1-compat-runtime
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/n1-runtime-2.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          no-cache: true
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            UV_IMAGE=${{ env.N1_UV_IMAGE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            CONTROL_PLANE_SCHEMA_REVISION=${{ env.N1_SCHEMA_REVISION }}
            ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
            N1_BASE_COMMIT=${{ env.N1_BASE_COMMIT }}
            N1_CONTRACT_VERSION=${{ env.N1_CONTRACT_VERSION }}
            N1_PATCH_SHA256=${{ env.N1_PATCH_SHA256 }}
            N1_PATCHED_TREE_HASH=${{ env.N1_PATCHED_TREE_HASH }}
      - name: Compare repeated OCI runtime facts and record blocked evidence
        run: |
          set -euo pipefail
          python -I -S saas/scripts/compare_oci_rebuilds.py \
            --label-profile n1 \
            --image "${N1_IMAGE_NAME}=${RUNNER_TEMP}/n1-runtime-1.tar,${RUNNER_TEMP}/n1-runtime-2.tar" \
            --output artifacts/n1-compat-rebuild.json
          jq -e \
            '.candidate_evidence_version == 3 and
             .diagnostic_policy == {
               config_environment: "omitted",
               history_created_by: "equality-and-ordinal-drift-only",
               layer_contents: "omitted"
             }' \
            artifacts/n1-compat-rebuild.json
          jq \
            --arg adapter "$ADAPTER_CONTRACT_VERSION" \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            --arg revision "$CANDIDATE_REVISION" \
            --arg upstream "$UPSTREAM_REVISION" \
            --arg buildx "$N1_BUILDX_VERSION" \
            --arg buildkit "$N1_BUILDKIT_IMAGE" \
            '. + {
              evidence_kind: "n1_security_compat_oci_candidate",
              product_revision: $revision,
              patch_source_revision: $revision,
              base_commit: $base,
              contract_version: $contract,
              patch_sha256: $patch,
              patched_tree_hash: $tree,
              required_schema_revision: $schema,
              upstream_revision: $upstream,
              adapter_contract_version: $adapter,
              approved_builder: {buildx_version: $buildx, buildkit_image: $buildkit},
              outbox_schema_change: {
                compat_worker_drain_required: true,
                catalog_recheck_before_restart: true
              },
              production_ready: false,
              external_hsm_receipt: null,
              vulnerability_scan: null,
              license_scan: null,
              canary: null,
              n_minus_one_rollback: null,
              production_receipt: null,
              production_blockers: [
                "external non-exportable KMS/HSM artifact Receipt is not attached",
                "vulnerability and license admission scans are not completed",
                "one-hour digest-pinned Canary is not completed",
                "900-second N-1 rollback exercise is not completed"
              ]
            }' artifacts/n1-compat-rebuild.json \
            > artifacts/n1-compat-candidate-evidence.json
          jq -e '.status == "pass" and .production_ready == false and .production_receipt == null' \
            artifacts/n1-compat-candidate-evidence.json
      - name: Upload blocked N-1 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n1-compat-candidate-${{ env.CANDIDATE_REVISION }}
          path: |
            artifacts-n1-builder.json
            artifacts/n1-compat-rebuild.json
            artifacts/n1-compat-candidate-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified clean OCI archive for protected publication
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish_signed &&
          github.ref == 'refs/heads/main' && inputs.product_revision == github.sha
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n1-compat-verified-oci-${{ env.CANDIDATE_REVISION }}
          path: ${{ runner.temp }}/n1-runtime-2.tar
          if-no-files-found: error
          retention-days: 1

  verify-postgresql-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNIGENT_SAAS_TEST_POSTGRES_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PostgreSQL current source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Pin isolated PostgreSQL 18 environment
        run: printf '%s\n' "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/postgresql-18-venv" >> "$GITHUB_ENV"
      - name: Install locked contract test dependencies without candidate build hooks
        run: uv sync --frozen --extra saas --group dev --no-install-local --no-config
      - name: Run PG18 patch and p0s3 schema contracts
        run: |
          set -euo pipefail
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -m pytest -q -c pyproject.toml --confcutdir=tests \
            tests/saas/test_n1_compat_patch.py
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -m pytest -q -c pyproject.toml --confcutdir=tests \
            tests/saas/test_control_plane_migration.py::test_real_postgresql_pinned_n1_outbox_compatibility_bridge \
            tests/saas/test_n1_outbox_admission.py::test_real_postgresql_n1_compat_login_admission_and_roles_replay

  verify-postgresql-n1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNIGENT_SAAS_TEST_POSTGRES_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout exact N-1 contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PostgreSQL N-1 source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Pin isolated PostgreSQL N-1 environment
        run: printf '%s\n' "UV_PROJECT_ENVIRONMENT=${RUNNER_TEMP}/postgresql-n1-venv" >> "$GITHUB_ENV"
      - name: Install locked N-1 test dependencies
        run: uv sync --frozen --extra saas --group dev --no-install-local --no-config
      - name: Verify PostgreSQL 16 and p0s3 N-1 contracts
        run: |
          set -euo pipefail
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I - <<'PY'
          import os

          import sqlalchemy as sa

          engine = sa.create_engine(os.environ["OMNIGENT_SAAS_TEST_POSTGRES_URL"])
          try:
              with engine.connect() as connection:
                  server_major = int(connection.scalar(sa.text("SHOW server_version_num"))) // 10000
              if server_major != 16:
                  raise SystemExit(f"expected PostgreSQL 16, observed {server_major}")
          finally:
              engine.dispose()
          PY
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -m pytest -q \
            -c pyproject.toml --confcutdir=tests \
            --junitxml="${RUNNER_TEMP}/postgresql-n1.xml" \
            tests/saas/test_control_plane_migration.py::test_real_postgresql_pinned_n1_outbox_compatibility_bridge \
            tests/saas/test_n1_outbox_admission.py::test_real_postgresql_n1_compat_login_admission_and_roles_replay \
            'tests/saas/test_n1_outbox_admission.py::test_real_postgresql_roles_allow_exact_rollback_schema_and_reject_newer_marker_drift[p0s000000004]'
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["RUNNER_TEMP"] + "/postgresql-n1.xml").getroot()
          if root.tag != "testsuites" or len(root) != 1 or root[0].tag != "testsuite":
              raise SystemExit("PostgreSQL N-1 JUnit structure rejected")
          suite = root[0]
          observed = {
              key: int(suite.attrib.get(key, "0"))
              for key in ("tests", "failures", "errors", "skipped")
          }
          expected = {"tests": 3, "failures": 0, "errors": 0, "skipped": 0}
          if observed != expected:
              raise SystemExit(f"PostgreSQL N-1 test cardinality rejected: {observed}")
          PY

  publish-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_signed &&
      github.ref == 'refs/heads/main' &&
      inputs.product_revision == github.sha
    needs:
      - verify-candidate
      - verify-postgresql-current
      - verify-postgresql-n1
    environment: production-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PRODUCT_REVISION: ${{ inputs.product_revision }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/saas-n1-compat-image.yml
    steps:
      - name: Validate protected publication coordinates
        env:
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_REF" == "refs/heads/main" ]]
          [[ "$PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCT_REVISION" == "$TRUSTED_REVISION" ]]
      - name: Checkout exact patch-source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.product_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Materialize exact fixed N-1 source for publication
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRODUCT_REVISION" ]]
          python -I -S saas/scripts/build_n1_compat.py \
            --repository . \
            --output-directory "${RUNNER_TEMP}/n1-source" \
            > artifacts-n1-builder.json
          jq -e \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg schema "$N1_SCHEMA_REVISION" \
            '.status == "verified" and
             .base_commit == $base and
             .contract_version == $contract and
             .patch_sha256 == $patch and
             .patched_tree_hash == $tree and
             .required_schema_revision == $schema and
             .schema_change_policy.outbox_ddl_requires_worker_drain == true and
             .schema_change_policy.catalog_recheck_before_restart == true' \
            artifacts-n1-builder.json
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: ${{ env.N1_BUILDX_VERSION }}
          driver-opts: image=${{ env.N1_BUILDKIT_IMAGE }}
      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Download verify-approved OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: n1-compat-verified-oci-${{ github.sha }}
          path: ${{ runner.temp }}/verified-oci
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable publication materials
        id: release
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          python_digest=$(crane digest python:3.12-slim)
          source_epoch=$(git show -s --format=%ct "$PRODUCT_REVISION")
          upstream_revision=$(jq -r .upstream_revision "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          adapter_contract=$(jq -r .adapter_contract_version "${RUNNER_TEMP}/n1-source/saas/upstream-baseline.json")
          echo "image=ghcr.io/${owner}/${N1_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${PRODUCT_REVISION}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "PYTHON_IMAGE=python:3.12-slim@${python_digest}" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_DATE_EPOCH=${source_epoch}" >> "$GITHUB_ENV"
          printf '%s\n' "UPSTREAM_REVISION=${upstream_revision}" >> "$GITHUB_ENV"
          printf '%s\n' "ADAPTER_CONTRACT_VERSION=${adapter_contract}" >> "$GITHUB_ENV"
      - name: Rebuild publication archive from fixed materials
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/n1-source
          file: ${{ runner.temp }}/n1-source/saas/n1_compat/Dockerfile
          target: n1-compat-runtime
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/n1-runtime-publish.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          no-cache: true
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            UV_IMAGE=${{ env.N1_UV_IMAGE }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_REVISION=${{ env.PRODUCT_REVISION }}
            UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            CONTROL_PLANE_SCHEMA_REVISION=${{ env.N1_SCHEMA_REVISION }}
            ADAPTER_CONTRACT_VERSION=${{ env.ADAPTER_CONTRACT_VERSION }}
            N1_BASE_COMMIT=${{ env.N1_BASE_COMMIT }}
            N1_CONTRACT_VERSION=${{ env.N1_CONTRACT_VERSION }}
            N1_PATCH_SHA256=${{ env.N1_PATCH_SHA256 }}
            N1_PATCHED_TREE_HASH=${{ env.N1_PATCHED_TREE_HASH }}
      - name: Fail closed on publication platform/material drift and push approved archive
        id: publish
        run: |
          set -euo pipefail
          python -I -S saas/scripts/compare_oci_rebuilds.py \
            --label-profile n1 \
            --image "${N1_IMAGE_NAME}=${RUNNER_TEMP}/verified-oci/n1-runtime-2.tar,${RUNNER_TEMP}/n1-runtime-publish.tar" \
            --output artifacts/n1-compat-publication-rebuild.json
          verified_archive_sha256=$(sha256sum "${RUNNER_TEMP}/verified-oci/n1-runtime-2.tar" | cut -d' ' -f1)
          publication_archive_sha256=$(sha256sum "${RUNNER_TEMP}/n1-runtime-publish.tar" | cut -d' ' -f1)
          comparison_sha256=$(sha256sum artifacts/n1-compat-publication-rebuild.json | cut -d' ' -f1)
          mkdir -p "${RUNNER_TEMP}/n1-runtime-publish-layout"
          tar -xf "${RUNNER_TEMP}/n1-runtime-publish.tar" \
            -C "${RUNNER_TEMP}/n1-runtime-publish-layout"
          expected_digest=$(jq -er \
            'select(.manifests | length == 1) | .manifests[0].digest' \
            "${RUNNER_TEMP}/n1-runtime-publish-layout/index.json")
          crane push "${RUNNER_TEMP}/n1-runtime-publish-layout" \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}"
          digest=$(crane digest "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}")
          [[ "$digest" == "$expected_digest" ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "verified_archive_sha256=${verified_archive_sha256}" >> "$GITHUB_OUTPUT"
          echo "publication_archive_sha256=${publication_archive_sha256}" >> "$GITHUB_OUTPUT"
          echo "comparison_sha256=${comparison_sha256}" >> "$GITHUB_OUTPUT"
      - name: Attest published digest with GitHub OIDC
        id: attest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Immediately verify registry digest and attestation identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$(crane digest "${IMAGE}:${IMAGE_TAG}")" == "$IMAGE_DIGEST" ]]
          gh attestation verify "oci://${IMAGE}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref refs/heads/main \
            --source-digest "$PRODUCT_REVISION" \
            --deny-self-hosted-runners
      - name: Record signed but production-blocked publication facts
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg adapter "$ADAPTER_CONTRACT_VERSION" \
            --arg attestation "$ATTESTATION_URL" \
            --arg base "$N1_BASE_COMMIT" \
            --arg contract "$N1_CONTRACT_VERSION" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image "$IMAGE" \
            --arg patch "$N1_PATCH_SHA256" \
            --arg revision "$PRODUCT_REVISION" \
            --arg schema "$N1_SCHEMA_REVISION" \
            --arg tree "$N1_PATCHED_TREE_HASH" \
            --arg upstream "$UPSTREAM_REVISION" \
            --arg buildx "$N1_BUILDX_VERSION" \
            --arg buildkit "$N1_BUILDKIT_IMAGE" \
            --arg verified_archive_sha256 "${{ steps.publish.outputs.verified_archive_sha256 }}" \
            --arg publication_archive_sha256 "${{ steps.publish.outputs.publication_archive_sha256 }}" \
            --arg comparison_sha256 "${{ steps.publish.outputs.comparison_sha256 }}" \
            '{
              schema_version: 1,
              evidence_kind: "signed_n1_security_compat_candidate",
              product_revision: $revision,
              patch_source_revision: $revision,
              base_commit: $base,
              contract_version: $contract,
              patch_sha256: $patch,
              patched_tree_hash: $tree,
              required_schema_revision: $schema,
              upstream_revision: $upstream,
              adapter_contract_version: $adapter,
              approved_builder: {buildx_version: $buildx, buildkit_image: $buildkit},
              outbox_schema_change: {
                compat_worker_drain_required: true,
                catalog_recheck_before_restart: true
              },
              image: ($image + "@" + $digest),
              registry_digest: $digest,
              verified_archive_sha256: $verified_archive_sha256,
              publication_archive_sha256: $publication_archive_sha256,
              publication_comparison_sha256: $comparison_sha256,
              github_oidc_attestation: $attestation,
              external_hsm_receipt: null,
              vulnerability_scan: null,
              license_scan: null,
              canary: null,
              n_minus_one_rollback: null,
              production_receipt: null,
              production_ready: false,
              production_blockers: [
                "external non-exportable KMS/HSM artifact Receipt is not attached",
                "vulnerability and license admission scans are not completed",
                "one-hour digest-pinned Canary is not completed",
                "900-second N-1 rollback exercise is not completed"
              ]
            }' > artifacts/n1-compat-published-candidate.json
          jq -e '.production_ready == false and .production_receipt == null' \
            artifacts/n1-compat-published-candidate.json
      - name: Upload signed blocked publication facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-n1-compat-candidate-${{ inputs.product_revision }}
          path: |
            artifacts-n1-builder.json
            artifacts/n1-compat-publication-rebuild.json
            artifacts/n1-compat-published-candidate.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
