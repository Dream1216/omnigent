name: SaaS Casdoor candidate

on:
  pull_request:
    paths:
      - "saas/production/casdoor/**"
      - "saas/scripts/prepare_casdoor_source.py"
      - ".github/workflows/saas-casdoor-candidate.yml"
  push:
    branches: ["codex/casdoor-integration-*"]
    paths:
      - "saas/production/casdoor/**"
      - "saas/scripts/prepare_casdoor_source.py"
      - ".github/workflows/saas-casdoor-candidate.yml"
  workflow_dispatch:
    inputs:
      discover_source_catalogs:
        description: Collect review-only PostgreSQL source catalogs without image publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: saas-casdoor-candidate-${{ github.ref }}-${{ inputs.discover_source_catalogs && 'catalogs' || 'image' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ !inputs.discover_source_catalogs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false
      - name: Prepare verified source and patch receipt
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
          python3 -m saas.scripts.prepare_casdoor_source --output "$RUNNER_TEMP/casdoor-source"
          cp "$RUNNER_TEMP/casdoor-source/stbz-source-receipt.json" "$RUNNER_TEMP/casdoor-source-receipt.json"
      - name: Set up immutable image builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Build isolated amd64 candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ runner.temp }}/casdoor-source
          file: saas/production/casdoor/Dockerfile
          platforms: linux/amd64
          build-args: PRODUCT_REVISION=${{ env.CANDIDATE_REVISION }}
          tags: casdoor-stbz:candidate
          outputs: type=docker,dest=${{ runner.temp }}/casdoor-candidate.tar
          push: false
          github-token: ""
      - name: Record immutable candidate bytes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum casdoor-candidate.tar > casdoor-candidate.tar.sha256
          printf '%s\n' "$CANDIDATE_REVISION" > casdoor-product-revision.txt
      - name: Upload isolated candidate for protocol acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: casdoor-candidate-${{ env.CANDIDATE_REVISION }}
          path: |
            ${{ runner.temp }}/casdoor-candidate.tar
            ${{ runner.temp }}/casdoor-candidate.tar.sha256
            ${{ runner.temp }}/casdoor-source-receipt.json
            ${{ runner.temp }}/casdoor-product-revision.txt
          retention-days: 7
          if-no-files-found: error

  source-catalogs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.discover_source_catalogs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role_profile: [core, model, admin, projection]
        postgres:
          - major: 16
            image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
          - major: 18
            image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANDIDATE_REVISION: ${{ github.sha }}
      OMNIGENT_SKIP_WEB_UI: "true"
      OMNIGENT_SAAS_PRODUCTION_REPLAY_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout immutable source review candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false
      - name: Verify source revision
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install locked source replay dependencies
        run: uv sync --frozen --extra all --group dev --extra saas
      - name: Collect review candidates without changing release anchors
        run: >-
          uv run python -m saas.scripts.collect_postgresql_source_catalog
          --major ${{ matrix.postgres.major }} --profile ${{ matrix.role_profile }}
          --work "$RUNNER_TEMP/source-catalog-work"
          --output "$RUNNER_TEMP/source-catalog-review"
      - name: Retain review-only source catalogs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: postgresql-source-catalog-${{ github.sha }}-pg${{ matrix.postgres.major }}-${{ matrix.role_profile }}
          path: ${{ runner.temp }}/source-catalog-review
          retention-days: 7
          if-no-files-found: error
