name: SaaS Aliyun Host candidate

on:
  push:
    branches: [codex/aliyun-sandbox-p1-p5-20261031]
    paths:
      - .github/workflows/saas-aliyun-host-candidate.yml
      - .github/ci-deps/package.json
      - saas/deployment/aliyun/**
      - saas/production/**
      - saas/runner_adapter/**
      - saas/compatibility/**
      - saas/control_plane/*.py
      - saas/scripts/compare_oci_rebuilds.py
      - saas/scripts/scan_oci_candidates.py
      - omnigent/**
      - sdks/**
      - pyproject.toml
      - setup.py
      - uv.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      mode:
        description: Build a new candidate or publish the reviewed complete Gen2 OCI for private cloud validation
        type: choice
        options: [build, promote-reviewed-gen2]
        default: build

permissions:
  contents: read

concurrency:
  group: saas-aliyun-host-${{ github.ref }}-${{ inputs.mode || 'build' }}
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.mode != 'promote-reviewed-gen2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen --extra all --extra saas --extra e2b --group dev
      - name: Check scoped transport and existing production boundaries
        run: |
          uv run pyrefly check saas/production/aliyun_sdk.py \
            saas/production/aliyun_server_profile.py saas/production/server.py \
            saas/production/aliyun_model_ingress.py \
            saas/production/aliyun_storage.py saas/production/aliyun_volume_control.py \
            saas/production/aliyun_storage_admission.py \
            saas/production/aliyun_artifacts.py \
            saas/production/aliyun_sts.py saas/production/aliyun_sts_issuer.py \
            saas/production/server_config.py \
            saas/production/aliyun_sandbox.py saas/production/aliyun_host.py \
            saas/production/aliyun_tenant_sandbox.py saas/production/tenant_sandbox.py \
            saas/production/aliyun_model_lease.py saas/production/aliyun_model_broker.py \
            saas/production/aliyun_model_client.py saas/production/platform_model_host.py \
            saas/production/platform_model_relay.py saas/control_plane/resolver.py \
            saas/control_plane/http_auth.py saas/runner_adapter/platform_model_gateway.py
          uv run pytest tests/saas/test_aliyun_sdk.py \
            tests/saas/test_aliyun_server_profile.py \
            tests/saas/test_aliyun_model_ingress.py \
            tests/saas/test_aliyun_storage.py tests/saas/test_aliyun_volume_control.py \
            tests/saas/test_aliyun_storage_admission.py tests/saas/test_aliyun_storage_launch.py \
            tests/saas/test_aliyun_sts_issuer.py \
            tests/saas/test_aliyun_artifacts.py \
            tests/saas/test_aliyun_server_composition.py \
            tests/saas/test_production_server.py tests/saas/test_production_server_config.py \
            tests/saas/test_aliyun_sandbox.py tests/saas/test_aliyun_sandbox_probe.py \
            tests/saas/test_aliyun_host.py tests/saas/test_aliyun_host_launcher.py \
            tests/saas/test_aliyun_tenant_sandbox.py \
            tests/saas/test_tenant_sandbox.py tests/saas/test_image_supply_chain.py \
            tests/saas/test_scan_oci_candidates.py tests/saas/test_aliyun_model_lease.py \
            tests/saas/test_aliyun_model_broker.py tests/saas/test_aliyun_model_client.py \
            tests/saas/test_control_plane_resolver.py tests/saas/test_http_cookie_auth.py \
            tests/saas/test_platform_model_relay.py tests/saas/test_platform_model_runtime.py \
            tests/saas/test_platform_model_gateway.py -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.5.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver-opts: image=moby/buildkit@sha256:b651bf250c2805569f1db385ad1ea8fb73737dfc851de305f274ca02690fa93f
      - name: Bind the exact source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          printf 'epoch=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build independently with provenance and SPDX
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: saas/deployment/aliyun/Dockerfile.host
          target: host
          platforms: linux/amd64
          push: false
          no-cache: true
          provenance: mode=max
          sbom: true
          tags: omnigent-aliyun-host:candidate
          outputs: type=oci,dest=${{ runner.temp }}/host.oci.tar,rewrite-timestamp=true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
      - name: Verify non-root runtime and frozen harnesses
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/host.oci.tar"
          python - <<'PY'
          import json, os, subprocess, tarfile
          from pathlib import Path
          from saas.scripts.compare_oci_rebuilds import inspect_oci_archive
          archive = Path(os.environ["RUNNER_TEMP"]) / "host.oci.tar"
          facts = inspect_oci_archive(archive, label_profile="aliyun-host-minimal")
          expected = facts["platforms"]["linux/amd64"]
          actual = json.loads(subprocess.check_output(["docker", "image", "inspect", "omnigent-aliyun-host:candidate"]))[0]
          with tarfile.open(archive) as stream:
              root = json.load(stream.extractfile("index.json"))["manifests"][0]["digest"]
          assert actual["Descriptor"]["digest"] == root and actual["Id"] == root
          assert actual["RootFS"]["Layers"] == expected["rootfs_diff_ids"]
          PY
          docker run --rm --pull never --network none --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges:true --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --tmpfs /home/user:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700 \
            --pids-limit 128 --memory 1g --cpus 1 \
            omnigent-aliyun-host:candidate /opt/venv/bin/python -B -I -c \
            'import glob,os,shutil,sys;from pathlib import Path;from omnigent import _build_info;from omnigent.onboarding.harness_install import harness_cli_installed;assert _build_info.COMMIT_SHA==sys.argv[1];assert os.getuid()==1000;assert all(shutil.which(x) for x in ("git","tmux","bwrap","node","sshd","chronyd","iptables","ossfs2"));assert all(harness_cli_installed(x) for x in ("pi","openai"));assert not glob.glob("/etc/ssh/ssh_host_*");assert Path("/etc/machine-id").stat().st_size==0;from saas.production import aliyun_host;assert Path(aliyun_host.__file__).resolve().is_relative_to(Path("/opt/venv"));private=Path.home()/".omnigent"/"runtime"/("aliyun-host-"+"a"*32+"-"+"b"*24);aliyun_host.prepare_aliyun_host_directory(private);assert private.stat().st_mode&0o777==0o700;assert private.stat().st_uid==1000' \
            "$GITHUB_SHA"
      - name: Retain exact OCI bytes for comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aliyun-host-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/host.oci.tar
          compression-level: 0
          retention-days: 7

  compare-and-scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aliyun-host-${{ github.sha }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/archives
      - name: Compare exact manifests, configs and attestations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          first="$RUNNER_TEMP/archives/aliyun-host-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-1/host.oci.tar"
          second="$RUNNER_TEMP/archives/aliyun-host-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-2/host.oci.tar"
          python -m saas.scripts.compare_oci_rebuilds --label-profile aliyun-host-minimal \
            --image "host=$first,$second" --output artifacts/rebuild-comparison.json
      - name: Scan exact candidate bytes and report vulnerability warnings
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/archives/aliyun-host-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-1/host.oci.tar"
          python -m saas.scripts.scan_oci_candidates --scope aliyun-host \
            --image "host=$first" --output artifacts/scan
      - name: Retain supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aliyun-host-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14

  promote-reviewed-gen2:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'promote-reviewed-gen2' &&
      github.repository == 'Dream1216/omnigent' &&
      github.ref == 'refs/heads/codex/aliyun-sandbox-p1-p5-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ORIGINAL_REVISION: 623f0c8f92ed923a5bba442b566a4f1ae228d175
      ORIGINAL_RUN: '41311645786'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Verify promotion policy and byte-binding regressions
        run: |
          uv sync --frozen --extra all --extra saas --extra e2b --group dev
          uv run pytest tests/saas/test_scan_oci_candidates.py tests/saas/test_aliyun_host_promotion.py -q
      - name: Verify original source run and successful complete runtime jobs
        run: |
          set -euo pipefail
          mkdir -p artifacts/original
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" > artifacts/original/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" > artifacts/original/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" > artifacts/original/artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/original')
          run = json.loads((root / 'run.json').read_text())
          assert run['head_sha'] == os.environ['ORIGINAL_REVISION']
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/saas-aliyun-host-candidate.yml'
          assert run['status'] == 'completed'
          jobs = json.loads((root / 'jobs.json').read_text())['jobs']
          for name in ('verify', 'build (1)', 'build (2)'):
              selected = [job for job in jobs if job['name'] == name]
              assert len(selected) == 1 and selected[0]['conclusion'] == 'success', name
          artifacts = json.loads((root / 'artifacts.json').read_text())['artifacts']
          expected = {
              13085796213: ('1', 'sha256:5c9d337db599e4c030540a67c8c4ddc94b5023e27a21814cb6ec35c96958d082'),
              13084864710: ('2', 'sha256:bb325f6185814725178368ca75f6397416f50fc2e8e30f9da07e18aa5e24a7ab'),
          }
          for artifact_id, (attempt, digest) in expected.items():
              selected = [item for item in artifacts if item['id'] == artifact_id]
              assert len(selected) == 1
              item = selected[0]
              assert not item['expired'] and item['digest'] == digest
              assert item['name'] == f"aliyun-host-{os.environ['ORIGINAL_REVISION']}-1-{attempt}"
          PY
      - name: Transfer the two exact original OCI archives without rebuilding
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13085796213/zip" > "$RUNNER_TEMP/first.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13084864710/zip" > "$RUNNER_TEMP/second.zip"
          python - <<'PY'
          import os
          from pathlib import Path
          from saas.scripts.oci_promotion import extract_artifact
          root = Path(os.environ['RUNNER_TEMP'])
          for name, digest in (
              ('first', '5c9d337db599e4c030540a67c8c4ddc94b5023e27a21814cb6ec35c96958d082'),
              ('second', 'bb325f6185814725178368ca75f6397416f50fc2e8e30f9da07e18aa5e24a7ab'),
          ):
              extract_artifact(root / f'{name}.zip', root / name, zip_sha256=digest)
              (root / f'{name}.zip').unlink()
          PY
          python -m saas.scripts.compare_oci_rebuilds --label-profile aliyun-host-minimal \
            --image "host=$RUNNER_TEMP/first/host.oci.tar,$RUNNER_TEMP/second/host.oci.tar" \
            --output artifacts/rebuild-comparison.json
      - name: Fresh advisory scan and source-bound promotion receipt
        run: |
          set -euo pipefail
          python -m saas.scripts.scan_oci_candidates --scope aliyun-host \
            --image "host=$RUNNER_TEMP/first/host.oci.tar" --output artifacts/scan
          python -m saas.scripts.aliyun_host_promotion prepare \
            --archive "$RUNNER_TEMP/first/host.oci.tar" --revision "$ORIGINAL_REVISION" \
            --scans artifacts/scan --layout "$RUNNER_TEMP/promotion-layout" \
            --receipt artifacts/promotion.json
      - uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish unchanged private validation candidate and verify registry bytes
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omnigent-aliyun-host"
          # Package visibility is an external setting: never infer it from defaults.
          [[ "$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/omnigent-aliyun-host" --jq .visibility)" == private ]]
          digest=$(jq -er .index_digest artifacts/promotion.json)
          tag="$image:source-$ORIGINAL_REVISION"
          crane push "$RUNNER_TEMP/promotion-layout" "$tag"
          [[ "$(crane digest "$tag")" == "$digest" ]]
          crane pull --format=oci --platform=all "$image@$digest" "$RUNNER_TEMP/readback-layout"
          tar -cf "$RUNNER_TEMP/readback.tar" -C "$RUNNER_TEMP/readback-layout" oci-layout index.json blobs
          python -m saas.scripts.aliyun_host_promotion readback \
            --archive "$RUNNER_TEMP/readback.tar" --receipt artifacts/promotion.json
          [[ "$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/omnigent-aliyun-host" --jq .visibility)" == private ]]
          printf 'name=%s\ndigest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$image" "$digest" > artifacts/image-reference.txt
      - name: Sign original image and advisory promotion receipt with publisher identity
        id: attest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://omnigent.ai/attestations/aliyun-host-promotion/v1
          predicate-path: artifacts/promotion.json
          push-to-registry: true
      - name: Verify exact signature identity and retain original build identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/saas-aliyun-host-candidate.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://omnigent.ai/attestations/aliyun-host-promotion/v1 \
            --deny-self-hosted-runners > artifacts/signature-verification.txt
          cp '${{ steps.attest.outputs.bundle-path }}' artifacts/promotion.sigstore.json
      - name: Retain candidate and original-source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aliyun-gen2-private-promotion-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
