name: SaaS enterprise IdP admission

on:
  workflow_dispatch:
    inputs:
      product_revision:
        description: Exact 40-character product revision covered by the evidence on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: saas-enterprise-idp-admission-${{ inputs.product_revision }}
  cancel-in-progress: false

jobs:
  provider-evidence-admission:
    if: github.ref == 'refs/heads/main'
    environment: production-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
      OMNIGENT_SAAS_TEST_POSTGRES_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      PRODUCT_REVISION: ${{ inputs.product_revision }}
      EVIDENCE_REVISION: ${{ github.sha }}
    steps:
      - name: Validate protected admission coordinates
        env:
          TRUSTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_REF" == "refs/heads/main" ]]
          [[ "$PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout immutable evidence revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install locked acceptance dependencies
        run: uv sync --frozen --extra dev --extra saas
      - name: Revalidate SCIM protocol, matrix and real PostgreSQL boundary
        run: >-
          uv run pytest
          tests/saas/test_enterprise_scim_http.py
          tests/saas/test_enterprise_identity_postgresql.py
          tests/saas/test_scim_compliance_matrix.py
      - name: Admit real provider and customer evidence
        run: >-
          uv run python -m saas.scripts.check_enterprise_readiness
          --product-revision "$PRODUCT_REVISION"
          --output artifacts/enterprise-idp-admission.json
          --require-ready
      - name: Upload fail-closed admission report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-idp-admission-${{ inputs.product_revision }}
          path: artifacts/enterprise-idp-admission.json
          if-no-files-found: error
          retention-days: 90
