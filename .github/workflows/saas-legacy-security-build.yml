          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate native inputs and construct typed statement
        id: admission
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m saas.scripts.legacy_initial_publisher attest-inputs \
            --control "$PWD" --product "$GITHUB_WORKSPACE/product" \
            --component "$LEGACY_COMPONENT" --control-revision "$CONTROL_REVISION" \
