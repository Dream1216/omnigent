name: First Server Buildx timeout capture probe
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: first-server-timeout-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  timeout-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROBE_CONTEXT: ${{ github.workspace }}/.first-server-timeout-context
    steps:
    - name: Checkout exact isolated diagnostic source
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up the existing Buildx action
      id: candidate-builder
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
    - name: Prepare tiny scratch sleep context and nested action
      run: "python - <<'PYCODE'\nimport hashlib, json, os, re, shutil, subprocess\nfrom pathlib import Path\ncontext\
        \ = Path(os.environ[\"PROBE_CONTEXT\"])\nrootfs = context / \"rootfs\"\nrootfs.mkdir(parents=True)\nsources\
        \ = {\"/bin/sleep\": Path(\"/usr/bin/sleep\")}\nlinked = subprocess.check_output([\"ldd\", \"/usr/bin/sleep\"\
        ], text=True)\nfor value in re.findall(r\"(/[A-Za-z0-9_./+\\-]+)\", linked):\n    sources[value] = Path(value)\n\
        materials = []\nfor target, source in sorted(sources.items()):\n    assert source.is_file()\n    destination\
        \ = rootfs / target.lstrip(\"/\")\n    destination.parent.mkdir(parents=True, exist_ok=True)\n    shutil.copy2(source.resolve(),\
        \ destination)\n    raw = destination.read_bytes()\n    materials.append({\"path\": target, \"bytes\": len(raw),\
        \ \"sha256\": hashlib.sha256(raw).hexdigest()})\nassert sum(row[\"bytes\"] for row in materials) < 16 *\
        \ 1024 * 1024\n(context / \"Dockerfile\").write_text('FROM scratch\\nCOPY rootfs/ /\\nRUN [\"/bin/sleep\"\
        , \"180\"]\\n')\nlocal = Path(\".first-server-timeout-composite\")\nlocal.mkdir()\naction = {\"name\": \"\
        Bounded nested Buildx timeout probe\", \"description\": \"No product image or publication\", \"runs\": {\"\
        using\": \"composite\", \"steps\": [{\"name\": \"Nested pinned Docker build action\", \"uses\": \"docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf\"\
        , \"with\": {\"context\": \"${{ env.PROBE_CONTEXT }}\", \"push\": False, \"platforms\": \"linux/amd64\"\
        , \"outputs\": \"type=cacheonly\", \"provenance\": False, \"sbom\": False, \"no-cache\": True}}]}}\n(local\
        \ / \"action.yml\").write_text(json.dumps(action, indent=2) + \"\\n\")\noutput = Path(\"artifacts/first-server-build-progress\"\
        )\noutput.mkdir(parents=True, exist_ok=True)\n(output / \"probe-materials.json\").write_text(json.dumps({\"\
        probe_only\": True, \"product_image\": False, \"registry_base_pulled\": False, \"materials\": materials},\
        \ indent=2) + \"\\n\")\nPYCODE\n"
    - name: Record actual builder and original history
      timeout-minutes: 2
      env:
        PROGRESS_BUILDER: ${{ steps.candidate-builder.outputs.name }}
      run: "python - <<'PYCODE'\nimport datetime, json, os, subprocess\nfrom pathlib import Path\noutput = Path(\"\
        artifacts/first-server-build-progress\")\nbuilder = os.environ[\"PROGRESS_BUILDER\"]\ncontext = {\"at_utc\"\
        : datetime.datetime.now(datetime.timezone.utc).isoformat(), \"builder\": builder, \"build_step_minutes\"\
        : 1, \"job_minutes\": 10, \"probe_only\": True, \"product_image\": False}\n(output / \"context.json\").write_text(json.dumps(context,\
        \ indent=2) + \"\\n\")\nwith (output / \"buildx-version.log\").open(\"wb\") as log:\n    subprocess.run([\"\
        docker\", \"buildx\", \"version\"], stdout=log, stderr=subprocess.STDOUT, check=True, timeout=15)\nwith\
        \ (output / \"history-before.json\").open(\"wb\") as log:\n    subprocess.run([\"docker\", \"buildx\", \"\
        --builder\", builder, \"history\", \"ls\", \"--format\", \"json\"], stdout=log, check=True, timeout=30)\n\
        PYCODE\n"
    - name: Timeout nested build on purpose
      id: first_server_build
      timeout-minutes: 1
      continue-on-error: true
      env:
        BUILDKIT_PROGRESS: plain
      uses: ./.first-server-timeout-composite
    - name: Retain first Server build original plain progress
      if: ${{ always() && steps.first_server_build.outcome != 'skipped' }}
      timeout-minutes: 5
      env:
        PROGRESS_BUILDER: ${{ steps.candidate-builder.outputs.name }}
        BUILD_OUTCOME: ${{ steps.first_server_build.outcome }}
      run: "python - <<'PYCODE'\nimport json, os, subprocess\nfrom pathlib import Path\noutput = Path(\"artifacts/first-server-build-progress\"\
        )\noutput.mkdir(parents=True, exist_ok=True)\nbuilder = os.environ[\"PROGRESS_BUILDER\"]\nreceipt = {\"\
        build_step_outcome\": os.environ[\"BUILD_OUTCOME\"],\n           \"origin\": \"original BuildKit history\
        \ plain progress\", \"complete\": False}\ntry:\n    with (output / \"history-after.json\").open(\"wb\")\
        \ as log:\n        subprocess.run([\"docker\", \"buildx\", \"--builder\", builder, \"history\", \"ls\",\n\
        \                        \"--format\", \"json\"], stdout=log, check=True, timeout=30)\n    def refs(path):\n\
        \        remaining = path.read_text().strip()\n        rows = []\n        while remaining:\n           \
        \ value, consumed = json.JSONDecoder().raw_decode(remaining)\n            rows.extend(value if isinstance(value,\
        \ list) else [value])\n            remaining = remaining[consumed:].lstrip()\n        assert all(isinstance(row,\
        \ dict) for row in rows), \"Invalid history row\"\n        result = {row.get(\"ref\") or row.get(\"ID\"\
        ) or row.get(\"Ref\") for row in rows}\n        assert all(isinstance(ref, str) and ref.strip() == ref and\
        \ ref for ref in result), \"Invalid build ref\"\n        return result\n    created = refs(output / \"history-after.json\"\
        ) - refs(output / \"history-before.json\")\n    assert len(created) == 1 and None not in created, \"Ambiguous\
        \ build record\"\n    ref = created.pop()\n    receipt[\"build_ref\"] = ref\n    with (output / \"server-1.progress.original.log\"\
        ).open(\"wb\") as log:\n        subprocess.run([\"docker\", \"buildx\", \"--builder\", builder, \"history\"\
        , \"logs\",\n                        \"--progress\", \"plain\", ref], stdout=log,\n                    \
        \   stderr=subprocess.STDOUT, check=True, timeout=120)\n    receipt[\"complete\"] = True\nexcept BaseException\
        \ as error:\n    receipt[\"capture_error_type\"] = type(error).__name__\n    raise\nfinally:\n    (output\
        \ / \"capture.json\").write_text(json.dumps(receipt, indent=2) + \"\\n\")\nPYCODE\n"
    - name: Verify actual intentional timeout and raw cancellation capture
      if: ${{ always() }}
      run: 'python - <<''PYCODE''

        import json

        from pathlib import Path

        output = Path("artifacts/first-server-build-progress")

        receipt = json.loads((output / "capture.json").read_text())

        progress = (output / "server-1.progress.original.log").read_text()

        assert receipt["build_step_outcome"] == "failure", receipt

        assert receipt["complete"] is True and receipt.get("build_ref"), receipt

        assert "/bin/sleep" in progress, "Probe RUN was not reached"

        assert "cancel" in progress.lower(), "Original BuildKit cancellation not observed"

        (output / "probe-verification.json").write_text(json.dumps({"kind": "bounded_nested_build_step_timeout_capture/v1",
        "intentional_step_failure": True, "native_build_log_has_sleep_and_cancellation": True, "capture_complete":
        True, "product_image": False, "production_admission": False, "CI_rerun": False}, indent=2) + "\n")

        PYCODE

        '
    - name: Retain bounded original probe evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: first-server-timeout-probe-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/first-server-build-progress/
        retention-days: 7
        if-no-files-found: error
