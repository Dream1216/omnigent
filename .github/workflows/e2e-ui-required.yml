name: E2E UI Required

# Required-status gate: a PR that changes web/** must ship a tests/e2e_ui/**
# test covering the change or carry a maintainer-effective `skip-e2e-ui-test`
# label. The policy verdict FAILS the job; mark `E2E UI Required` as a required
# check in branch protection for that to block merge. Whether a change "needs a
# test" is decided by an LLM judge (check.sh case 2), not file-presence, so
# refactors/renames/dep-bumps/styling/test-only edits don't trip the gate and a
# throwaway test doesn't satisfy it.
#
# Trigger is `pull_request_target`, so the workflow + gate script run from main
# with the base token even for fork PRs: the PR-head copy never runs (a PR can't
# weaken the gate), and `labeled`/`unlabeled` let the skip label re-evaluate it.
#
# SECURITY -- the LLM judge reads the PR's (attacker-controlled) diff as TEXT and
# sends it to the configured gateway, or to Copilot through the job-scoped
# GITHUB_TOKEN when the gateway is not configured. The job never checks out or
# runs PR-head code: it checks out ONLY .github/scripts from main (pinned, no
# persisted credentials) and reads state via the API. The Copilot fallback runs
# in an empty directory with only the read-only `view` tool exposed. The judge
# prompt is hardened against injection and fails closed; a wrong "pass" can't
# merge anything since the required `Maintainer Approval` check + a human
# reviewer still gate merge.
#
# NO `paths:` filter on purpose: a path-filtered required check never reports on
# non-matching PRs, stranding the status pending forever. This always runs and
# the gate script self-determines whether web/** was touched.
#
# leak-scan-allow: pull_request_target
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # PR re-syncs / relabels share a group by PR number so old runs cancel.
  group: e2e-ui-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-e2e-ui:
    name: E2E UI Required
    # Skip drafts; the `ready_for_review` trigger re-fires on un-drafting.
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: read
      actions: write   # dispatch a Merge Ready re-evaluation when this flips green
      copilot-requests: write  # secretless judge fallback via the job-scoped token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate scripts from main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main             # trusted base; never the PR head
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Load maintainers
        id: maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/merge-ready/load-maintainers.sh

      - name: Select e2e_ui judge backend
        id: judge
        env:
          OPENAI_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [[ -n "$OPENAI_BASE_URL" && -n "$OPENAI_API_KEY" ]]; then
            echo "backend=gateway" >> "$GITHUB_OUTPUT"
          elif [[ -z "$OPENAI_BASE_URL" && -z "$OPENAI_API_KEY" ]]; then
            echo "backend=copilot" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Incomplete e2e_ui judge gateway configuration; set both GATEWAY_BASE_URL and LLM_API_KEY, or neither."
            exit 1
          fi

      - name: Install pinned Copilot CLI
        if: steps.judge.outputs.backend == 'copilot'
        env:
          COPILOT_VERSION: 1.0.86
          COPILOT_PACKAGE_INTEGRITY: sha512-ytl6vkox1l6Y+UqLhX0+SOuTkS84VCp8R2CJqzgJ8QfnOlWe3U6z1ZVRm/sYWGMLchWQpnC7d+wWZ1mTUTFuuQ==
          COPILOT_LINUX_X64_INTEGRITY: sha512-ROyWMEP8nKFoa+7l2majzfgA5jaqid0qEYTClf9oooS+8S6CIhKYlW1VO6Lt3lDicoCI1S2RWbR7vJ6ZQy/TFw==
        run: |
          set -euo pipefail
          actual_package=$(npm view "@github/copilot@$COPILOT_VERSION" dist.integrity)
          actual_binary=$(npm view "@github/copilot-linux-x64@$COPILOT_VERSION" dist.integrity)
          [[ "$actual_package" == "$COPILOT_PACKAGE_INTEGRITY" ]] \
            || { echo "::error::Copilot CLI package integrity mismatch"; exit 1; }
          [[ "$actual_binary" == "$COPILOT_LINUX_X64_INTEGRITY" ]] \
            || { echo "::error::Copilot CLI Linux binary integrity mismatch"; exit 1; }

          install_root="$RUNNER_TEMP/copilot-cli"
          npm install --global --prefix "$install_root" --no-audit --no-fund \
            "@github/copilot@$COPILOT_VERSION"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/copilot" --version | grep -F "GitHub Copilot CLI $COPILOT_VERSION"

      - name: Require e2e_ui coverage or effective waiver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MAINTAINERS: ${{ steps.maintainers.outputs.list }}
          # OpenAI-compatible gateway (same secrets the e2e suites use).
          OPENAI_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          E2E_UI_JUDGE_MODEL: ${{ vars.OMNIGENT_CI_E2E_JUDGE_MODEL }}
          E2E_UI_COPILOT_MODEL: ${{ vars.OMNIGENT_CI_E2E_COPILOT_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/e2e-ui-required/check.sh

      # Merge Ready (the single required gating check) does NOT re-evaluate when
      # this check flips green: E2E UI Required isn't in Merge Ready's
      # workflow_run trigger list, and its check_run only wakes Merge Ready for
      # DCO. So when a `skip-e2e-ui-test` waiver (or a newly pushed test) turns
      # this check green, the PR would otherwise sit BLOCKED with every check
      # already green. Nudge Merge Ready to re-post its status. Only on success --
      # a red gate must stay blocking, and Merge Ready ignores a workflow_dispatch
      # re-eval that isn't fully green anyway.
      - name: Re-evaluate Merge Ready
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run merge-ready.yml -R "$REPO" -f pr="$PR" \
            || echo "::warning::could not dispatch Merge Ready re-evaluation for #$PR"
