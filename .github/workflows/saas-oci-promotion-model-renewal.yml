name: Promote admitted model-renewal security OCI

on:
  pull_request:
    paths:
      - ".github/workflows/saas-oci-promotion-model-renewal.yml"
      - "saas/scripts/resume_oci_promotion.py"
      - "saas/supply_chain/oci-promotion-model-renewal-7cea0940.json"
      - "tests/saas/test_resume_oci_promotion.py"
      - "tests/saas/test_model_renewal_publication.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/saas-oci-promotion-model-renewal.yml"
      - "saas/scripts/resume_oci_promotion.py"
      - "saas/supply_chain/oci-promotion-model-renewal-7cea0940.json"
      - "tests/saas/test_resume_oci_promotion.py"
      - "tests/saas/test_model_renewal_publication.py"
  workflow_dispatch:
    inputs:
      policy_revision:
        description: Exact approved main SHA for this signing workflow, not the product SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-model-renewal-7cea0940
  cancel-in-progress: false

env:
  PRODUCT_REVISION: 7cea09404d49fc965ce053e51803688a5be5fe53
  SOURCE_DATE_EPOCH: "1792575662"
  ORIGINAL_CANDIDATE_RUN_ID: "39578869162"
  SIGNING_POLICY_REVISION: ${{ github.sha }}

jobs:
  verify-resume-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen --group dev --extra saas
      - uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Exercise unchanged admission gates and real OCI round-trip
        run: |
          set -euo pipefail
          export OCI_PROMOTION_TEST_CRANE="$(command -v crane)"
          uv run pytest tests/saas/test_model_renewal_publication.py tests/saas/test_resume_oci_promotion.py tests/saas/test_oci_promotion.py tests/saas/test_image_supply_chain.py -q

  admit-original:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.policy_revision == github.sha
    needs: verify-resume-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      manifest-sha256: 8ea523a6e537bdd5d05bf4b193cfb67972a857ac4a19b471526c96e0ce3021f0
      oci-artifact-id: "12344292161"
      oci-artifact-sha256: 057b0b7a77d2103ba1cc23789ea956469148cf51032efee5a17fcab3e3b05fcb
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify original successful candidate job and immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Dream1216/omnigent" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$SIGNING_POLICY_REVISION" ]]
          python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 preflight \
            --root "${RUNNER_TEMP}/original-report" > "${RUNNER_TEMP}/original-admission.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-renewal-original-admission
          path: ${{ runner.temp }}/original-admission.json
          if-no-files-found: error
          retention-days: 90

  publish-signed:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.policy_revision == github.sha &&
      github.ref == 'refs/heads/main'
    needs: admit-original
    environment: production-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/saas-oci-promotion-model-renewal.yml
      CANDIDATE_MANIFEST_SHA256: ${{ needs.admit-original.outputs.manifest-sha256 }}
    steps:
      - name: Validate protected release coordinates
        env:
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_REF" == "refs/heads/main" ]]
          [[ "$PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SIGNING_POLICY_REVISION" == "$TRUSTED_REVISION" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$SIGNING_POLICY_REVISION" ]]
      - name: Checkout immutable release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Download and validate original admitted OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_ARTIFACT_ID: ${{ needs.admit-original.outputs.oci-artifact-id }}
          OCI_ARTIFACT_SHA256: ${{ needs.admit-original.outputs.oci-artifact-sha256 }}
        run: |
          set -euo pipefail
          source_epoch="$SOURCE_DATE_EPOCH"
          printf '%s\n' "SOURCE_DATE_EPOCH=${source_epoch}" >> "$GITHUB_ENV"
          python -m saas.scripts.oci_promotion download \
            --root "${RUNNER_TEMP}/admitted-oci" --revision "$PRODUCT_REVISION" \
            --source-date-epoch "$source_epoch" \
            --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --artifact-id "$OCI_ARTIFACT_ID" --artifact-sha256 "$OCI_ARTIFACT_SHA256" \
            --run-id "$ORIGINAL_CANDIDATE_RUN_ID" --repository "$GITHUB_REPOSITORY"
          python -m saas.scripts.scan_oci_candidates \
            --image "server=${RUNNER_TEMP}/admitted-oci/server-1.tar" \
            --image "host=${RUNNER_TEMP}/admitted-oci/host-1.tar" \
            --output artifacts/promotion-current-scans/grype
          python -m saas.scripts.oci_promotion prepare \
            --root "${RUNNER_TEMP}/admitted-oci" --revision "$PRODUCT_REVISION" \
            --source-date-epoch "$source_epoch" \
            --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --current-scans artifacts/promotion-current-scans \
            --layout-root "${RUNNER_TEMP}/admitted-layouts" --discard-transferred-archives
      - name: Retain current same-OCI scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-current-scans-${{ env.PRODUCT_REVISION }}
          path: artifacts/promotion-current-scans/
          if-no-files-found: warn
          retention-days: 90
      - name: Reuse the exact original signed wheel without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheel=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 wheel --root "${RUNNER_TEMP}/original-wheel")
          mkdir -p artifacts
          gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/saas-image-candidate.yml" \
            --source-ref refs/heads/main --source-digest "$PRODUCT_REVISION" \
            --deny-self-hosted-runners --format json > artifacts/original-wheel-verification.json
          python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 verify-wheel \
            --verification artifacts/original-wheel-verification.json
          cp "$wheel" artifacts/
          python -m saas.scripts.check_wheel_contents artifacts
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable promotion coordinates
        id: release
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          prefix="ghcr.io/${owner}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${PRODUCT_REVISION}" >> "$GITHUB_OUTPUT"
      - name: Promote admitted server OCI without rebuilding
        id: build-server
        env:
          IMAGE_TAG: ${{ steps.release.outputs.prefix }}/omnigent-saas-server:${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          expected=$(jq -er .images.server.index_digest "${RUNNER_TEMP}/admitted-oci/oci-promotion-manifest.json")
          crane push "${RUNNER_TEMP}/admitted-layouts/server" "$IMAGE_TAG"
          [[ "$(crane digest "$IMAGE_TAG")" == "$expected" ]]
          echo "digest=${expected}" >> "$GITHUB_OUTPUT"
          test -f "${RUNNER_TEMP}/admitted-layouts/server/index.json"
          rm -r -- "${RUNNER_TEMP:?}/admitted-layouts/server"
      - name: Promote admitted host OCI without rebuilding
        id: build-host
        env:
          IMAGE_TAG: ${{ steps.release.outputs.prefix }}/omnigent-saas-host:${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          expected=$(jq -er .images.host.index_digest "${RUNNER_TEMP}/admitted-oci/oci-promotion-manifest.json")
          crane push "${RUNNER_TEMP}/admitted-layouts/host" "$IMAGE_TAG"
          [[ "$(crane digest "$IMAGE_TAG")" == "$expected" ]]
          echo "digest=${expected}" >> "$GITHUB_OUTPUT"
          test -f "${RUNNER_TEMP}/admitted-layouts/host/index.json"
          rm -r -- "${RUNNER_TEMP:?}/admitted-layouts/host"
      - name: Read back promoted OCI bytes before signing
        env:
          SERVER_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-server@${{ steps.build-server.outputs.digest }}
          HOST_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-host@${{ steps.build-host.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          crane pull --format=oci --platform=all "$SERVER_IMAGE" "${RUNNER_TEMP}/server-promoted-layout"
          crane pull --format=oci --platform=all "$HOST_IMAGE" "${RUNNER_TEMP}/host-promoted-layout"
          for artifact in server host; do
            tar -cf "${RUNNER_TEMP}/${artifact}-promoted.tar" \
              -C "${RUNNER_TEMP}/${artifact}-promoted-layout" oci-layout index.json blobs
          done
          python -m saas.scripts.oci_promotion readback \
            --root "${RUNNER_TEMP}/admitted-oci" --revision "$PRODUCT_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --server "${RUNNER_TEMP}/server-promoted.tar" --host "${RUNNER_TEMP}/host-promoted.tar" \
            > artifacts/promotion-readback-before-signing.json
          for artifact in server host; do
            test -f "${RUNNER_TEMP}/${artifact}-promoted-layout/index.json"
            rm -r -- "${RUNNER_TEMP:?}/${artifact}-promoted-layout"
            rm -- "${RUNNER_TEMP:?}/${artifact}-promoted.tar"
          done
      - name: Verify published image runtime revision
        env:
          SERVER_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-server@${{ steps.build-server.outputs.digest }}
          HOST_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-host@${{ steps.build-host.outputs.digest }}
        run: |
          set -euo pipefail
          for artifact in server host; do
            image=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
              --root "${RUNNER_TEMP}/admitted-oci" --role "$artifact" --architecture amd64)
            docker run --rm --pull always --platform linux/amd64 --network none \
              --entrypoint /opt/venv/bin/python "$image" -B -I -c \
              'import sys; from omnigent import _build_info; expected=sys.argv[1]; actual=_build_info.COMMIT_SHA; assert actual == expected, f"published runtime revision {actual!r} does not match {expected!r}"' \
              "$PRODUCT_REVISION"
          done
          SERVER_IMAGE=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
            --root "${RUNNER_TEMP}/admitted-oci" --role server --architecture amd64)
          HOST_IMAGE=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
            --root "${RUNNER_TEMP}/admitted-oci" --role host --architecture amd64)
          docker run --rm --pull always --platform linux/amd64 --network none \
            --entrypoint /opt/venv/bin/python "$SERVER_IMAGE" -B -I -c \
            'import kubernetes; import saas.production.platform_model_sandbox_host'
          docker run --rm --pull always --platform linux/amd64 --network none \
            --entrypoint /opt/venv/bin/python "$HOST_IMAGE" -B -I -c \
            'import saas.production.platform_model_sandbox_host'
          docker run --rm --pull always --platform linux/amd64 --network none \
            --entrypoint /opt/venv/bin/python "$HOST_IMAGE" -B -I -c \
            'from omnigent.onboarding.harness_install import harness_cli_installed; keys=("anthropic", "openai", "pi", "kiro", "kimi", "qwen", "opencode", "gemini", "devin", "jcode"); failed=[key for key in keys if not harness_cli_installed(key)]; assert not failed, f"published Host image has missing or unsupported harness CLIs: {failed}"'
      - name: Install hash-pinned Syft and Grype
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/supply-chain-tools"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/grype.tar.gz" \
            https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47 "${RUNNER_TEMP}/syft.tar.gz" \
            0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d "${RUNNER_TEMP}/grype.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/supply-chain-tools" syft
          tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C "${RUNNER_TEMP}/supply-chain-tools" grype
          "${RUNNER_TEMP}/supply-chain-tools/syft" version
          "${RUNNER_TEMP}/supply-chain-tools/grype" version
      - name: Generate per-architecture SBOMs and check raw findings
        env:
          SERVER_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-server@${{ steps.build-server.outputs.digest }}
          HOST_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-host@${{ steps.build-host.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          for artifact in server host; do
            case "$artifact" in
              server) image="$SERVER_IMAGE" ;;
              host) image="$HOST_IMAGE" ;;
              *) exit 2 ;;
            esac
            for arch in amd64 arm64; do
              image=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
                --root "${RUNNER_TEMP}/admitted-oci" --role "$artifact" --architecture "$arch")
              prefix="artifacts/supply-chain/${artifact}-${arch}"
              docker run --rm --pull always --platform "linux/${arch}" --network none \
                --entrypoint /usr/local/bin/python "$image" -B -I -c \
                'import pyexpat, zlib; assert pyexpat.EXPAT_VERSION == "expat_2.9.0", pyexpat.EXPAT_VERSION; assert zlib.ZLIB_RUNTIME_VERSION == "1.3.2.1-motley", zlib.ZLIB_RUNTIME_VERSION'
              docker run --rm --pull always --platform "linux/${arch}" --network none \
                --entrypoint /bin/sh "$image" -ec \
                'test ! -e /usr/bin/perl && test ! -e /usr/local/bin/perl'
              "${RUNNER_TEMP}/supply-chain-tools/syft" "$image" \
                --platform "linux/${arch}" \
                -o "spdx-json=${prefix}.spdx.json" \
                -o "cyclonedx-json=${prefix}.cyclonedx.json"
              "${RUNNER_TEMP}/supply-chain-tools/grype" "$image" \
                --platform "linux/${arch}" -o json > "${prefix}.raw.grype.json"
              jq -e '
                ([.matches[] | select(.vulnerability.severity == "Critical")] | length) == 0 and
                ([.matches[] | select(.vulnerability.severity == "High")] | length) == 0 and
                (.ignoredMatches // []) == []
              ' "${prefix}.raw.grype.json" >/dev/null
            done
          done
          "${RUNNER_TEMP}/supply-chain-tools/grype" db status -o json \
            > artifacts/supply-chain/grype-database.json
          find artifacts/supply-chain -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > artifacts/supply-chain/SHA256SUMS
      - name: Sign server image provenance with GitHub OIDC
        id: attest-server
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-server
          subject-digest: ${{ steps.build-server.outputs.digest }}
          push-to-registry: true
      - name: Sign host image provenance with GitHub OIDC
        id: attest-host
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-host
          subject-digest: ${{ steps.build-host.outputs.digest }}
          push-to-registry: true
      - name: Record supported GitHub workflow SLSA with original-product materials
        id: coordinates
        run: |
          set -euo pipefail
          python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 predicate \
            --policy-revision "$SIGNING_POLICY_REVISION" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" > artifacts/promotion-provenance.json
          jq -e --arg repository "https://github.com/$GITHUB_REPOSITORY" '
            .buildDefinition.buildType == "https://actions.github.io/buildtypes/workflow/v1" and
            .buildDefinition.externalParameters.workflow.repository == $repository and
            .buildDefinition.externalParameters.workflow.ref == "refs/heads/main" and
            .buildDefinition.externalParameters.workflow.path == ".github/workflows/saas-oci-promotion-model-renewal.yml"
          ' artifacts/promotion-provenance.json >/dev/null
          for role in server host; do
            for arch in amd64 arm64; do
              image=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
                --root "${RUNNER_TEMP}/admitted-oci" --role "$role" --architecture "$arch")
              echo "${role}-${arch}=${image##*@}" >> "$GITHUB_OUTPUT"
            done
          done
      - name: Sign server original-product promotion provenance
        id: attest-server-promotion
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-server
          subject-digest: ${{ steps.build-server.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: artifacts/promotion-provenance.json
          push-to-registry: true
      - name: Sign server amd64 explicit SPDX subject
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-server
          subject-digest: ${{ steps.coordinates.outputs.server-amd64 }}
          sbom-path: artifacts/supply-chain/server-amd64.spdx.json
          push-to-registry: true
      - name: Sign server arm64 explicit SPDX subject
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-server
          subject-digest: ${{ steps.coordinates.outputs.server-arm64 }}
          sbom-path: artifacts/supply-chain/server-arm64.spdx.json
          push-to-registry: true
      - name: Sign host original-product promotion provenance
        id: attest-host-promotion
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-host
          subject-digest: ${{ steps.build-host.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: artifacts/promotion-provenance.json
          push-to-registry: true
      - name: Sign host amd64 explicit SPDX subject
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-host
          subject-digest: ${{ steps.coordinates.outputs.host-amd64 }}
          sbom-path: artifacts/supply-chain/host-amd64.spdx.json
          push-to-registry: true
      - name: Sign host arm64 explicit SPDX subject
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.release.outputs.prefix }}/omnigent-saas-host
          subject-digest: ${{ steps.coordinates.outputs.host-arm64 }}
          sbom-path: artifacts/supply-chain/host-arm64.spdx.json
          push-to-registry: true
      - name: Verify image signatures and protected workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-server@${{ steps.build-server.outputs.digest }}
          HOST_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-host@${{ steps.build-host.outputs.digest }}
        run: |
          set -euo pipefail
          for role in server host; do
            case "$role" in server) image="$SERVER_IMAGE" ;; host) image="$HOST_IMAGE" ;; esac
            gh attestation verify "oci://${image}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-ref refs/heads/main \
              --source-digest "$SIGNING_POLICY_REVISION" \
              --deny-self-hosted-runners --format json > "artifacts/${role}-verified-signatures.json"
            python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 verify \
              --verification "artifacts/${role}-verified-signatures.json" --subject "${image##*@}" \
              --policy-revision "$SIGNING_POLICY_REVISION" --run-id "$GITHUB_RUN_ID" \
              --attempt "$GITHUB_RUN_ATTEMPT"
            for arch in amd64 arm64; do
              child=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
                --root "${RUNNER_TEMP}/admitted-oci" --role "$role" --architecture "$arch")
              gh attestation verify "oci://${child}" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$SIGNER_WORKFLOW" --source-ref refs/heads/main \
                --source-digest "$SIGNING_POLICY_REVISION" --deny-self-hosted-runners \
                --predicate-type https://spdx.dev/Document --format json \
                > "artifacts/${role}-${arch}-verified-signatures.json"
              python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 verify-sbom \
                --verification "artifacts/${role}-${arch}-verified-signatures.json" \
                --subject "${child##*@}" --sbom "artifacts/supply-chain/${role}-${arch}.spdx.json" \
                --policy-revision "$SIGNING_POLICY_REVISION" --run-id "$GITHUB_RUN_ID" \
                --attempt "$GITHUB_RUN_ATTEMPT"
            done
          done
      - name: Pull signed images by digest as exact OCI archives
        env:
          SERVER_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-server@${{ steps.build-server.outputs.digest }}
          HOST_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-host@${{ steps.build-host.outputs.digest }}
        run: |
          set -euo pipefail
          crane pull --format=oci --platform=all "$SERVER_IMAGE" "${RUNNER_TEMP}/server-signed-layout"
          crane pull --format=oci --platform=all "$HOST_IMAGE" "${RUNNER_TEMP}/host-signed-layout"
          for artifact in server host; do
            tar -cf "${RUNNER_TEMP}/${artifact}-signed.tar" \
              -C "${RUNNER_TEMP}/${artifact}-signed-layout" oci-layout index.json blobs
            test -f "${RUNNER_TEMP}/${artifact}-signed-layout/index.json"
            rm -r -- "${RUNNER_TEMP:?}/${artifact}-signed-layout"
          done
      - name: Scan signed image digests on both architectures
        run: >-
          python -m saas.scripts.scan_oci_candidates
          --image server=${{ runner.temp }}/server-signed.tar
          --image host=${{ runner.temp }}/host-signed.tar
          --output artifacts/signed-grype
      - name: Verify signed OCI still equals the admitted candidate
        run: |
          set -euo pipefail
          python -m saas.scripts.oci_promotion readback \
            --root "${RUNNER_TEMP}/admitted-oci" --revision "$PRODUCT_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --server "${RUNNER_TEMP}/server-signed.tar" --host "${RUNNER_TEMP}/host-signed.tar" \
            > artifacts/promotion-readback-after-signing.json
          cp "${RUNNER_TEMP}/admitted-oci/oci-promotion-manifest.json" artifacts/
      - name: Upload exact signed-image scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-image-scans-${{ env.PRODUCT_REVISION }}
          path: artifacts/signed-grype/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record signed candidate facts
        env:
          SERVER_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-server
          SERVER_DIGEST: ${{ steps.build-server.outputs.digest }}
          HOST_IMAGE: ${{ steps.release.outputs.prefix }}/omnigent-saas-host
          HOST_DIGEST: ${{ steps.build-host.outputs.digest }}
          WHEEL_ATTESTATION: https://github.com/Dream1216/omnigent/attestations/58194115
          SERVER_ATTESTATION: ${{ steps.attest-server.outputs.attestation-url }}
          HOST_ATTESTATION: ${{ steps.attest-host.outputs.attestation-url }}
          SERVER_PRODUCT_ATTESTATION: ${{ steps.attest-server-promotion.outputs.attestation-url }}
          HOST_PRODUCT_ATTESTATION: ${{ steps.attest-host-promotion.outputs.attestation-url }}
          OCI_ARTIFACT_ID: ${{ needs.admit-original.outputs.oci-artifact-id }}
          OCI_ARTIFACT_SHA256: ${{ needs.admit-original.outputs.oci-artifact-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg revision "$PRODUCT_REVISION" \
            --arg policy_revision "$SIGNING_POLICY_REVISION" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg wheel_attestation "$WHEEL_ATTESTATION" \
            --arg server_image "$SERVER_IMAGE" \
            --arg server_digest "$SERVER_DIGEST" \
            --arg server_attestation "$SERVER_ATTESTATION" \
            --arg server_product_attestation "$SERVER_PRODUCT_ATTESTATION" \
            --arg host_image "$HOST_IMAGE" \
            --arg host_digest "$HOST_DIGEST" \
            --arg host_attestation "$HOST_ATTESTATION" \
            --arg host_product_attestation "$HOST_PRODUCT_ATTESTATION" \
            --arg manifest_sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --arg artifact_id "$OCI_ARTIFACT_ID" --arg artifact_sha256 "$OCI_ARTIFACT_SHA256" \
            '{schema_version: 1, evidence_kind: "protected_ci_signed_release_candidate", product_revision: $revision, signing_policy_revision: $policy_revision, signing_run_id: $run_id, signing_run_attempt: $run_attempt, original_candidate_run_id: 39578869162, workflow_identity: $workflow, wheel_attestation: $wheel_attestation, images: [{name: $server_image, digest: $server_digest, attestation: $server_attestation, product_promotion_attestation: $server_product_attestation}, {name: $host_image, digest: $host_digest, attestation: $host_attestation, product_promotion_attestation: $host_product_attestation}], promotion: {candidate_manifest_sha256: $manifest_sha256, original_artifact_id: $artifact_id, original_artifact_sha256: $artifact_sha256, rebuilt: false}, production_deployment_receipt: null}' \
            > artifacts/signed-release-candidate.json
      - name: Upload signed release candidate facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-candidate-${{ env.PRODUCT_REVISION }}
          path: |
            artifacts/signed-release-candidate.json
            artifacts/original-wheel-verification.json
            artifacts/*.whl
            artifacts/*verified-signatures.json
            artifacts/promotion-provenance.json
            artifacts/oci-promotion-manifest.json
            artifacts/promotion-readback-*.json
            artifacts/promotion-current-scans/
            artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 90

  verify-published-source:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.policy_revision == github.sha &&
      github.ref == 'refs/heads/main'
    needs: [admit-original, publish-signed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      CANDIDATE_MANIFEST_SHA256: ${{ needs.admit-original.outputs.manifest-sha256 }}
    steps:
      - name: Checkout immutable independent verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Download immutable signed release facts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-candidate-${{ env.PRODUCT_REVISION }}
          path: release-facts
      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6
        with:
          version: v0.21.6
      - name: Log in to image registry for independent readback
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Independently verify registry digests, source labels and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_REVISION: ${{ env.PRODUCT_REVISION }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/saas-oci-promotion-model-renewal.yml
        run: |
          set -euo pipefail
          facts=release-facts/signed-release-candidate.json
          jq -e --arg revision "$PRODUCT_REVISION" \
            '.schema_version == 1 and .product_revision == $revision and .signing_policy_revision == env.SIGNING_POLICY_REVISION and .signing_run_id == env.GITHUB_RUN_ID and .signing_run_attempt == env.GITHUB_RUN_ATTEMPT and (.images | length) == 2' \
            "$facts" >/dev/null
          server_seen=0
          host_seen=0
          while IFS=$'\t' read -r name digest; do
            case "$name" in
              "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omnigent-saas-server")
                [[ "$server_seen" == 0 ]]; server_seen=1 ;;
              "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omnigent-saas-host")
                [[ "$host_seen" == 0 ]]; host_seen=1 ;;
              *) exit 2 ;;
            esac
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="${name}@${digest}"
            [[ "$(crane digest "$image")" == "$digest" ]]
            for platform in linux/amd64 linux/arm64; do
              crane config --platform "$platform" "$image" |
                jq -e --arg revision "$PRODUCT_REVISION" \
                  '.config.Labels["org.opencontainers.image.revision"] == $revision' >/dev/null
            done
            gh attestation verify "oci://${image}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-ref refs/heads/main \
              --source-digest "$SIGNING_POLICY_REVISION" \
              --deny-self-hosted-runners --format json > "release-facts/${name##*/}-independent-signatures.json"
            python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 verify \
              --verification "release-facts/${name##*/}-independent-signatures.json" --subject "$digest" \
              --policy-revision "$SIGNING_POLICY_REVISION" --run-id "$GITHUB_RUN_ID" \
              --attempt "$GITHUB_RUN_ATTEMPT"
            role="${name##*/omnigent-saas-}"
            for arch in amd64 arm64; do
              child=$(python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 child \
                --root release-facts --role "$role" --architecture "$arch")
              gh attestation verify "oci://${child}" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$SIGNER_WORKFLOW" --source-ref refs/heads/main \
                --source-digest "$SIGNING_POLICY_REVISION" --deny-self-hosted-runners \
                --predicate-type https://spdx.dev/Document --format json \
                > "release-facts/${role}-${arch}-independent-signatures.json"
              python -m saas.scripts.resume_oci_promotion --release model-renewal-7cea0940 verify-sbom \
                --verification "release-facts/${role}-${arch}-independent-signatures.json" \
                --subject "${child##*@}" --sbom "release-facts/supply-chain/${role}-${arch}.spdx.json" \
                --policy-revision "$SIGNING_POLICY_REVISION" --run-id "$GITHUB_RUN_ID" \
                --attempt "$GITHUB_RUN_ATTEMPT"
            done
          done < <(jq -r '.images[] | [.name, .digest] | @tsv' "$facts")
          [[ "$server_seen" == 1 && "$host_seen" == 1 ]]
      - name: Independently read back exact accepted OCI contents
        run: |
          set -euo pipefail
          facts=release-facts/signed-release-candidate.json
          source_epoch="$SOURCE_DATE_EPOCH"
          for artifact in server host; do
            image=$(jq -er --arg suffix "/omnigent-saas-${artifact}" \
              '.images[] | select(.name | endswith($suffix)) | .name + "@" + .digest' "$facts")
            crane pull --format=oci --platform=all "$image" "${RUNNER_TEMP}/${artifact}-readback-layout"
            tar -cf "${RUNNER_TEMP}/${artifact}-readback.tar" \
              -C "${RUNNER_TEMP}/${artifact}-readback-layout" oci-layout index.json blobs
            test -f "${RUNNER_TEMP}/${artifact}-readback-layout/index.json"
            rm -r -- "${RUNNER_TEMP:?}/${artifact}-readback-layout"
          done
          python -m saas.scripts.oci_promotion readback \
            --root release-facts --revision "$PRODUCT_REVISION" \
            --source-date-epoch "$source_epoch" \
            --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --server "${RUNNER_TEMP}/server-readback.tar" --host "${RUNNER_TEMP}/host-readback.tar" \
            > release-facts/independent-oci-readback.json
      - name: Upload independent OCI readback receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-oci-readback-${{ env.PRODUCT_REVISION }}
          path: |
            release-facts/independent-oci-readback.json
            release-facts/*-independent-signatures.json
          if-no-files-found: error
          retention-days: 90
