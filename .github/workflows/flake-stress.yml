name: Native status diagnostic (original shard6)

on:
  workflow_dispatch:
    inputs:
      test_target:
        required: true
        description: Fixed original test root
      target_branch:
        required: true
        description: Immutable diagnostic SHA, identical to workflow SHA
      attempts:
        required: true
        default: "1"
        description: Exactly one diagnostic shard
      workers:
        required: true
        default: "3"
        description: Original worker count
      dist:
        required: true
        default: loadscope
        description: Original scheduler
      extra_pytest_args:
        required: true
        description: Exact bounded shard6 parameters

permissions:
  contents: read

env:
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  CODEX: ""
  CLAUDE_CODE: ""

jobs:
  repro:
    name: Original E2E shard6/8 with status origins
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate bounded original shard inputs
        shell: bash
        env:
          TARGET: ${{ inputs.test_target }}
          REVISION: ${{ inputs.target_branch }}
          WORKFLOW_REVISION: ${{ github.sha }}
          ATTEMPTS: ${{ inputs.attempts }}
          WORKERS: ${{ inputs.workers }}
          DIST: ${{ inputs.dist }}
          EXTRA: ${{ inputs.extra_pytest_args }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == 'tests/e2e/' ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ && "$REVISION" == "$WORKFLOW_REVISION" ]]
          [[ "$ATTEMPTS" == 1 && "$WORKERS" == 3 && "$DIST" == loadscope ]]
          [[ "$EXTRA" == '--reruns 0 --timeout=180 --timeout-method=thread --max-worker-restart=0 --shard-id=6 --num-shards=8' ]]
      - name: Checkout exact diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_branch }}
          persist-credentials: false
      - name: Verify original suite and exact recording inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          pins = {'uv.lock': 'd5f1d133221f33dca75e9e0a4e7c49b2bded0da5cfcabc2ae212f7e615681ce2',
           'pyproject.toml': '77ffd5d339656adfec3e7b15660599226ff29a527e05f75cdbbb386ad280550f',
           '.python-version': '7b55f8e67b5623c4bef3fa691288da9437d79d3aba156de48d481db32ac7d16d',
           'tests/e2e/resilience/scenarios/test_s5_host_offline_user_acts.py': 'cf83927273f4d4ef5c789d7bc7aee5b50aca206fbb4b61620b7b8af8ba391697',
           'tests/e2e/resilience/scenarios/_contract.py': 'dffc64d6d1a31e467673577224366956ac61e50091a7e7471fb8f7561ac53d44',
           'tests/e2e/resilience/lab/lab.py': 'f5674d45ec033cc98e62062c11c1de609e418d15f6fdf5e1c6261fb96cf9561b',
           'tests/e2e/resilience/lab/driver.py': 'cc68bcab108035460f7641472594989631f198aacc916b59a530facffe0fe59c',
           'omnigent/harnesses/codex_native/forwarder.py': '3a286d5ffa3071c31b06725aa7bbbb59bab7aa3a1f2288e633e4174e8e33c07f',
           '.github/actions/setup-harness-cli/locks/codex/package.json': '52dc186d237572ee62a07787346c8db931720a26f1c08575b2671c8c8786bdd8',
           '.github/actions/setup-harness-cli/locks/codex/package-lock.json': '87428d34f0f8ca1eefdb076a064f8bdf7dc2712c0180e67bac0e6395d751a7a0',
           'omnigent/server/routes/_sessions/helpers.py': '3599c931c4c83375c67797a678fecdfd6bb809b60faacf2f5287054666d74eac',
           'omnigent/runner/app.py': 'ee4e890f319f4cdbd50fb1d715c9ba13738736911e39849650474b3a5f9b7e01',
           '.github/actions/e2e-run/action.yml': '26a708d2eaa230842393f764ef0d716ed57f4fc7dcfc5f3eaf748287f631ec1e',
           'tests/conftest.py': '54a9017176a2a4d423f377122e3d6cd7e9dcc024af3eed15ea6237f1c45e8828'}
          for name, expected in pins.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          trees = {'tests': '5a4d50bff2970454b82ac5bef24b96fad3b939e9', '.github/actions/e2e-run': '41565b02670eebb39d0072f068667d51b61d3dbc', '.github/actions/setup-harness-cli': '4367ca3bc5070a7797492485018a00f2dbe5b9cd'}
          for path, expected in trees.items():
              assert subprocess.check_output(["git", "rev-parse", "HEAD:" + path]).decode().strip() == expected, path
          PY
      - name: Run original failed shard6 once
        uses: ./.github/actions/e2e-run
        env:
          PYTEST_ADDOPTS: --reruns 0
          OMNIGENT_RESILIENCE_KEEP: "1"
          OMNIGENT_RESILIENCE_REPORT_DIR: ${{ runner.temp }}/native-status-reports
        with:
          shard_id: "6"
          num_shards: "8"
          parallelism: "3"
          nightly_full: "false"
          dependency_smoke: "false"
      - name: Export original shard native-status metadata
        if: always()
        shell: bash
        env:
          NATIVE_DIAG_REPORT_DIR: ${{ runner.temp }}/native-status-reports
          NATIVE_DIAG_OUTPUT: artifacts/native-status-metadata
          NATIVE_DIAG_JUNIT: /tmp/omnigent-e2e-${{ github.run_id }}-shard6/junit.xml
        run: |
          python3 - <<'PY'
          """Collect bounded metadata for the one native-status diagnostic."""

          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = Path(os.environ["NATIVE_DIAG_REPORT_DIR"])
          output = Path(os.environ["NATIVE_DIAG_OUTPUT"])
          output.mkdir(parents=True, exist_ok=True)
          marker = "session_status_ordering_diagnostic "
          target = "test_s5_host_offline_user_acts[codex-send-20s]"
          keys = {
              "wall", "mono", "mono_ns", "at_utc", "session_id", "previous_status",
              "status", "effective_status", "response_id", "old_active_response_id",
              "origin", "failure_origin", "caller", "caller_function", "caller_line", "phase", "utc", "monotonic_ns", "incoming_status", "incoming_response_id", "turn_bind_epoch", "active_turn_present", "harness",
          }
          event_keys = {"wall", "mono", "source", "kind", "tag", "mode", "runner_id", "host_id"}
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          decoder = json.JSONDecoder()
          selected = []
          states = []
          events = []
          lifecycle = []
          seen = set()

          for report_path in sorted(reports.glob("*.json")):
              report = json.loads(report_path.read_text())
              if report.get("params") != {"harness": "codex", "action": "send", "outage_s": 20}:
                  continue
              root = Path(report["lab_root"]).resolve()
              if root.parent != Path("/tmp").resolve() or not root.name.startswith("rlab-"):
                  raise SystemExit("Diagnostic Lab path is outside the expected temporary scope")
              selected.append({
                  "scenario": report["scenario"], "params": report["params"],
                  "started": report["started"], "timeline": report["timeline"],
                  "checks": [{k: c[k] for k in ("name", "passed", "detail", "known_gap", "intermittent")}
                             for c in report["checks"]],
              })
              log_paths = [*sorted((root / "logs").glob("*.log")), *sorted((root / "data/logs").rglob("*.log"))]
              for log_path in log_paths:
                  if not log_path.is_file():
                      continue
                  for raw in log_path.read_text(errors="replace").splitlines():
                      line = ansi.sub("", raw)
                      if marker in line:
                          try:
                              value, _ = decoder.raw_decode(line.split(marker, 1)[1].lstrip())
                          except ValueError:
                              continue
                          if not isinstance(value, dict):
                              continue
                          safe = {k: v for k, v in value.items() if k in keys
                                  and (v is None or isinstance(v, (bool, int, float))
                                       or isinstance(v, str) and len(v) <= 256)}
                          identity = json.dumps(safe, sort_keys=True)
                          if safe and identity not in seen:
                              states.append(safe)
                              seen.add(identity)
                      match = re.search(
                          r"Codex forwarder publishing turn status: source=(\S+) turn_id=(\S+) status=(\S+)",
                          line,
                      )
                      if match:
                          lifecycle.append({"timestamp_prefix": line[:40], "source": match[1],
                                            "turn_id": match[2], "status": match[3]})
              event_path = root / "events.jsonl"
              if event_path.is_file():
                  for raw in event_path.read_text().splitlines():
                      value = json.loads(raw)
                      safe = {k: v for k, v in value.items() if k in event_keys
                              and (v is None or isinstance(v, (bool, int, float))
                                   or isinstance(v, str) and len(v) <= 128)}
                      events.append(safe)

          if len(selected) != 1 or any(len(values) > 5000 for values in (states, events, lifecycle)):
              raise SystemExit("Expected one bounded diagnostic report")

          payloads = {
              "scenario.json": selected[0], "status-origins.json": states,
              "lab-events.json": events, "codex-lifecycle.json": lifecycle,
              "provenance.json": {
                  "purpose": "One original shard6/8 diagnostic; no application qualification or flake verdict",
                  "runtime_base_revision": "b3bca582363144ef7013b10910782241ee7b59da",
                  "diagnostic_revision": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "target": target, "executions": 1, "reruns": 0,
                  "outage_seconds": 20, "idle_settle_seconds": 15,
                            "shard_id": 6, "num_shards": 8, "workers": 3, "dist": "loadscope", "nightly_full": False,
                  "raw_Lab_files_uploaded": False, "source_trace_metadata_records": len(states),
                  "paid_model_calls_requested": False,
                            "runner_status_records": sum(row.get("origin") == "runner_turn_status" for row in states),
              },
          }
          junit_path = Path(os.environ["NATIVE_DIAG_JUNIT"])
          junit = ET.parse(junit_path).getroot()
          suite_rows = [row.attrib for row in junit.iter("testsuite")]
          result_summary = [{k: row.get(k) for k in ("name", "tests", "failures", "errors", "skipped", "time")} for row in suite_rows]
          payloads["original-shard6-results.json"] = result_summary

          for name, value in payloads.items():
              (output / name).write_text(json.dumps(value, indent=2, allow_nan=False) + "\n")
          if not states or not any(row.get("origin") == "runner_turn_status" for row in states):
              raise SystemExit("Server or Runner status-origin trace is missing; diagnostic evidence is incomplete")
          PY
      - name: Upload bounded status-origin metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-status-origins-shard6-${{ github.run_id }}
          path: artifacts/native-status-metadata/
          retention-days: 7
          if-no-files-found: warn
