name: SQLite package diagnostic (temporary branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Collect fixed-DB CPE results (not image admission)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Prepare actual APK root filesystem without an application image build
        env:
          PINNED_BASE: cgr.dev/chainguard/wolfi-base@sha256:1c451d46a0d5c4e9f2b38e0e8d3e299564a1aa95c21973efcc1980a9d1d2e73e
        run: |
          set -euo pipefail
          container_name="sqlite-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/sqlite-apk-root" "$RUNNER_TEMP/sqlite-package-probe"
          docker run --name "$container_name" --entrypoint /bin/sh "$PINNED_BASE" -ec '
            apk add --no-cache sqlite-libs=3.54.1-r0
            apk info -v sqlite-libs glibc-2.44
            apk info -L sqlite-libs
            if command -v sqlite3; then exit 1; fi
            if apk info -e sqlite; then exit 1; fi
          ' | tee "$RUNNER_TEMP/sqlite-package-probe/actual-apk-install.txt"
          docker export "$container_name" | tar --no-same-owner --no-same-permissions -xf - -C "$RUNNER_TEMP/sqlite-apk-root"
          find "$RUNNER_TEMP/sqlite-apk-root" -type f \( -name sqlite3 -o -name sqlite3.exe \) > "$RUNNER_TEMP/sqlite-package-probe/sqlite-shell-files.txt"
          test ! -s "$RUNNER_TEMP/sqlite-package-probe/sqlite-shell-files.txt"
      - name: Collect actual pinned scanner results
        run: |
          python -B - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          from saas.scripts.scan_oci_candidates import install_grype, parse_database_status

          root = Path(os.environ["RUNNER_TEMP"]) / "sqlite-package-probe"
          root.mkdir(exist_ok=True)
          binary = install_grype(root)
          config = root / "grype.yaml"
          config.write_text(
              "ignore: []\nvex-documents: []\ncheck-for-app-update: false\ndb:\n"
              f"  cache-dir: {root / 'db'}\n"
              "  auto-update: true\n  validate-age: true\n"
              "  max-allowed-built-age: 24h\n"
          )
          subprocess.run([str(binary), "-c", str(config), "db", "update"], check=True)
          status = json.loads(subprocess.check_output(
              [str(binary), "-c", str(config), "db", "status", "-o", "json"], text=True
          ))
          parse_database_status(status, now=datetime.now(UTC))
          rows = []
          targets = [
              ("CPE-3.53.4", "cpe:2.3:a:sqlite:sqlite:3.53.4:*:*:*:*:*:*:*"),
              ("CPE-3.54.1", "cpe:2.3:a:sqlite:sqlite:3.54.1:*:*:*:*:*:*:*"),
              ("actual-APK-root", f"dir:{Path(os.environ['RUNNER_TEMP']) / 'sqlite-apk-root'}"),
          ]
          for label, target in targets:
              report = root / f"sqlite-{label}.json"
              result = subprocess.run([
                  str(binary), "-c", str(config), target, "--fail-on", "high",
                  "-o", "json", "--file", str(report),
              ], check=False)
              if result.returncode not in (0, 2):
                  raise RuntimeError(f"Scanner execution failed: {result.returncode}")
              original = json.loads(report.read_text())
              findings = [
                  {"id": item["vulnerability"]["id"], "severity": item["vulnerability"]["severity"],
                   "package": item["artifact"]["name"], "version": item["artifact"]["version"]}
                  for item in original["matches"]
                  if item["vulnerability"]["severity"] in ("Critical", "High")
              ]
              rows.append({
                  "target": target, "scanner_exit": result.returncode,
                  "findings": findings,
                  "report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
              })
          (root / "diagnostic-summary.json").write_text(json.dumps({
              "source": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "database": status,
              "results": rows, "image_or_release_admission": False,
              "purpose": "Actual CPE version comparison only; job completion does not mean zero High.",
          }, indent=2) + "\n")
          print(json.dumps(rows))
          PYTHON
      - name: Retain original diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlite-package-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-package-probe/
          if-no-files-found: error
          retention-days: 3
