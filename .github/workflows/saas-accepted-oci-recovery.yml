          uv run python -m saas.scripts.oci_promotion seal --root "$RUNNER_TEMP/same-m8c-oci" --revision "$PRODUCT_REVISION" --source-date-epoch "$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
