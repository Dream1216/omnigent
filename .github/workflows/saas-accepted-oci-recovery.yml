name: Recover accepted M165 OCI bytes

on:
  pull_request:
    paths:
      - ".github/workflows/saas-accepted-oci-recovery.yml"
      - "saas/scripts/accepted_oci_recovery.py"
      - "tests/saas/test_accepted_oci_recovery.py"
      - "saas/scripts/accepted_m165_clean_context.py"
      - "tests/saas/test_accepted_m165_clean_context.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/saas-accepted-oci-recovery.yml"
      - "saas/scripts/accepted_oci_recovery.py"
      - "tests/saas/test_accepted_oci_recovery.py"
      - "saas/scripts/accepted_m165_clean_context.py"
      - "tests/saas/test_accepted_m165_clean_context.py"
  workflow_dispatch:
    inputs:
      policy_revision:
        description: Exact reviewed main controller SHA; product remains M165
        required: true
        type: string
      phase:
        description: Recover cached bytes, or rescan the retained raw checkpoint
        type: choice
        options: [build, confirm-server, scan, complete-m8c, build-clean-m8c]
        default: build
      comparison_profile:
        description: Historical exact pair, or the independently confirmed clean M165 Server pair
        type: choice
        options: [historical, clean-M165-server]
        default: historical
      raw_run_id:
        type: string
      raw_artifact_id:
        type: string
      raw_artifact_sha256:
        type: string

permissions:
  contents: read

concurrency:
  group: accepted-M165-recovery
  cancel-in-progress: false

env:
  PRODUCT_REVISION: 165cebe8585a1a5fa8588e2a55f37505f89f3e55
  SOURCE_REVISION: 165cebe8585a1a5fa8588e2a55f37505f89f3e55
  SOURCE_DATE_EPOCH: "1794108147"
  UPSTREAM_REVISION: ee728a02004749e7f6971beee6c66d990bfbd216
  ADAPTER_CONTRACT_VERSION: "0.2.0"
  CONTROL_PLANE_SCHEMA_REVISION: p0s000000018
  PYTHON_IMAGE: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
  RUNTIME_IMAGE: cgr.dev/chainguard/wolfi-base@sha256:1c451d46a0d5c4e9f2b38e0e8d3e299564a1aa95c21973efcc1980a9d1d2e73e
  NODE_IMAGE: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
  GO_IMAGE: golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d

jobs:
  complete-m8c-first-server:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Dream1216/omnigent' && github.ref == 'refs/heads/main' && inputs.policy_revision == github.sha && (inputs.phase == 'complete-m8c' || inputs.phase == 'build-clean-m8c')
    needs: verify-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.raw.outputs.artifact-id }}
      artifact-sha256: ${{ steps.raw.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact protected M8c recovery controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen --extra saas
      - name: Authenticate and retain exact original M8c first Server
        id: retained-m8c
        run: |
          set -euo pipefail
          uv run python -m saas.scripts.accepted_oci_recovery m8c-prepare \
            --root "$RUNNER_TEMP/accepted-m8c-raw" --github-env "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/accepted-m8c-control"
          git archive "$GITHUB_SHA" saas | tar -x -C "$RUNNER_TEMP/accepted-m8c-control"
      - name: Checkout unchanged M8c product for missing builds
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 8c851bdd12829340b2a327cf7542fe4de84d9132
          persist-credentials: false
      - name: Verify frozen M8c checkout and locked helpers
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRODUCT_REVISION" ]]
          [[ "$(git rev-parse HEAD^{tree})" == 694a997f3e74999f968f4341851ebaf0765d50aa ]]
          [[ -z "$(git status --porcelain)" ]]
          uv sync --frozen --extra saas
      - name: Prepare unchanged admitted M8c runtime evidence
        uses: ./saas/actions/runtime-evidence-context
        with:
          product-revision: 8c851bdd12829340b2a327cf7542fe4de84d9132
          evidence-revision: 1da1acd35a63ab3c14a14dff030f0061e1f74314
      - name: Complete original Server preflight before missing builds
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          .venv/bin/python "$RUNNER_TEMP/accepted-m8c-control/saas/scripts/scan_oci_candidates.py" \
            --scope server-preflight --image "server=$RUNNER_TEMP/accepted-m8c-raw/server-1.tar" \
            --output "$RUNNER_TEMP/accepted-m8c-raw/grype-preflight"
      - name: Set up original isolated M8c Docker runtime
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.5.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: m8c-builder
      - name: Preserve cached original M8c Server as history only
        if: inputs.phase == 'build-clean-m8c'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/accepted-m8c-raw/original-history"
          mv "$RUNNER_TEMP/accepted-m8c-raw/server-1.tar" "$RUNNER_TEMP/accepted-m8c-raw/original-history/"
      - name: Build new clean M8c Server attempt 1
        if: inputs.phase == 'build-clean-m8c'
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: server
          target: runtime
          attempt: "1"
      - name: Verify new clean M8c Server SDK on both architectures
        if: inputs.phase == 'build-clean-m8c'
        env:
          CANDIDATE_REVISION: ${{ env.PRODUCT_REVISION }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json, os, re, secrets, subprocess, tarfile
          from pathlib import Path
          from saas.scripts.compare_oci_rebuilds import inspect_oci_archive
          archive = Path(os.environ["RUNNER_TEMP"]) / "server-1.tar"
          revision = os.environ["CANDIDATE_REVISION"]
          facts = inspect_oci_archive(archive, label_profile="executable")
          with tarfile.open(archive) as stream:
              descriptors = json.load(stream.extractfile("index.json"))["manifests"]
          assert len(descriptors) == 1
          root = descriptors[0]["digest"]
          subprocess.run(["docker", "load", "-i", str(archive)], check=True)
          verified = []
          owner = secrets.token_hex(16)
          probe_names = []
          errors = []
          try:
              actual = json.loads(subprocess.check_output([
                  "docker", "image", "inspect", root,
              ]))[0]
              assert actual["Descriptor"]["digest"] == root and actual["Id"] == root
              for arch in ("amd64", "arm64"):
                  platform = f"linux/{arch}"
                  actual = json.loads(subprocess.check_output([
                      "docker", "image", "inspect", "--platform", platform, root,
                  ]))[0]
                  expected = facts["platforms"][platform]
                  assert actual["Descriptor"]["digest"] == actual["Id"] == expected["manifest_digest"]
                  assert actual["RootFS"]["Layers"] == expected["rootfs_diff_ids"]
                  name = f"omnigent-sdk-{owner}-{arch}"
                  probe_names.append(name)
                  subprocess.run([
                      "docker", "run", "--pull", "never", "--platform", platform,
                      "--name", name, "--label", f"io.omnigent.sdk-probe={owner}",
                      "--no-healthcheck",
                      "--network", "none", "--user", "1000:1000", "--cap-drop", "ALL",
                      "--security-opt", "no-new-privileges:true", "--read-only",
                      "--tmpfs", "/tmp:rw,nosuid,nodev,size=64m,mode=1777",
                      "--pids-limit", "128", "--memory", "512m", "--cpus", "1",
                      "--entrypoint", "/opt/venv/bin/python", root, "-B", "-I", "-c",
                      'import os,sys,kubernetes;from pathlib import Path;from importlib.metadata import version;from omnigent import _build_info;import saas.production.aliyun_server_profile as profile;import saas.production.aliyun_model_ingress;assert version("e2b")=="2.31.0";assert version("alibabacloud-sandbox20260820")=="1.2.0";assert version("alibabacloud-sts20150401")=="1.2.0";assert version("alibabacloud-oss-v2")=="1.4.0";assert version("defusedxml")=="0.7.1";import saas.production.aliyun_artifacts;import saas.production.aliyun_storage_admission;import saas.production.aliyun_sts_issuer;assert _build_info.COMMIT_SHA==sys.argv[1];assert os.getuid()==1000;assert Path(profile.__file__).resolve().is_relative_to(Path("/opt/venv"))',
                      revision,
                  ], check=True, timeout=180)
                  verified.append({"platform": platform, "config_digest": expected["config_digest"], "manifest_digest": expected["manifest_digest"]})
          except BaseException as error:
              errors.append(error)
          finally:
              for name in probe_names:
                  try:
                      identifiers = subprocess.check_output([
                          "docker", "container", "ls", "--all", "--no-trunc",
                          "--filter", f"name=^/{name}$",
                          "--filter", f"label=io.omnigent.sdk-probe={owner}",
                          "--format", "{{.ID}}",
                      ], text=True, timeout=30).splitlines()
                      for identifier in identifiers:
                          assert re.fullmatch(r"[0-9a-f]{64}", identifier)
                          subprocess.run(["docker", "container", "rm", "--force", identifier], check=True, timeout=30)
                  except BaseException as error:
                      errors.append(error)
              try:
                  subprocess.run(["docker", "image", "rm", root], check=True, timeout=30)
              except BaseException as error:
                  errors.append(error)
              if len(errors) == 1:
                  raise errors[0]
              if errors:
                  raise BaseExceptionGroup("SDK verification and cleanup failed", errors)
          with archive.open("rb") as stream:
              archive_sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
          Path("artifacts/server-candidate-runtime.json").write_text(json.dumps({
              "schema_version": 1, "source_revision": revision,
              "archive_sha256": archive_sha256, "root_digest": root,
              "e2b_version": "2.31.0", "platforms": verified, "passed": True,
          }, sort_keys=True, indent=2) + "\n")
          PY
      - name: Prove clean M8c source and preflight before independent builds
        if: inputs.phase == 'build-clean-m8c'
        env:
          PYTHONPATH: ${{ runner.temp }}/accepted-m8c-control
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/server-1.tar" "$RUNNER_TEMP/accepted-m8c-raw/"
          cp artifacts/server-candidate-runtime.json "$RUNNER_TEMP/accepted-m8c-raw/"
          .venv/bin/python -m saas.scripts.accepted_oci_recovery m8c-clean-first --root "$RUNNER_TEMP/accepted-m8c-raw"
          .venv/bin/python -m saas.scripts.scan_oci_candidates --scope server-preflight \
            --image "server=$RUNNER_TEMP/accepted-m8c-raw/server-1.tar" \
            --output "$RUNNER_TEMP/accepted-m8c-raw/grype-clean-preflight"
      - name: Independently build only missing M8c Server attempt 2
        id: m8c-server-2
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: server
          target: runtime
          attempt: "2"
      - name: Build only missing M8c Host attempt 1
        id: m8c-host-1
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: host
          target: host
          attempt: "1"
      - name: Independently build only missing M8c Host attempt 2
        id: m8c-host-2
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: host
          target: host
          attempt: "2"
      - name: Preserve missing M8c OCI before comparison
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/server-2.tar" "$RUNNER_TEMP/host-1.tar" \
            "$RUNNER_TEMP/host-2.tar" "$RUNNER_TEMP/accepted-m8c-raw/"
      - name: Reclaim only original ephemeral M8c builder cache
        env:
          RECOVERY_BUILDER: ${{ steps.m8c-builder.outputs.name }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_BUILDER" =~ ^builder-[a-zA-Z0-9][a-zA-Z0-9_-]{1,90}$ ]]
          docker buildx prune --builder "$RECOVERY_BUILDER" --all --force
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Compare exact original M8c independent Server and Host pairs
        env:
          PYTHONPATH: ${{ runner.temp }}/accepted-m8c-control
          CLEAN_CONTEXT: ${{ inputs.phase == 'build-clean-m8c' && '--clean-context' || '' }}
        run: |
          set -euo pipefail
          .venv/bin/python -m saas.scripts.compare_oci_rebuilds --label-profile executable \
            --image "omnigent-saas-server=$RUNNER_TEMP/accepted-m8c-raw/server-1.tar,$RUNNER_TEMP/accepted-m8c-raw/server-2.tar" \
            --image "omnigent-saas-host=$RUNNER_TEMP/accepted-m8c-raw/host-1.tar,$RUNNER_TEMP/accepted-m8c-raw/host-2.tar" \
            --output "$RUNNER_TEMP/accepted-m8c-raw/saas-image-candidate.json"
          .venv/bin/python "$RUNNER_TEMP/accepted-m8c-control/saas/scripts/accepted_oci_recovery.py" \
            m8c-verify --root "$RUNNER_TEMP/accepted-m8c-raw" $CLEAN_CONTEXT
      - name: Retain complete original M8c four OCI raw checkpoint
        id: raw
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-raw-8c851bdd12829340b2a327cf7542fe4de84d9132-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted-m8c-raw/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Preserve completed M8c bytes on any later failure as unqualified
        if: failure() && !cancelled() && steps.retained-m8c.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-m8c-unqualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/accepted-m8c-raw/
            ${{ runner.temp }}/server-1.tar
            ${{ runner.temp }}/server-2.tar
            ${{ runner.temp }}/host-1.tar
            ${{ runner.temp }}/host-2.tar
          compression-level: 0
          if-no-files-found: warn
          retention-days: 1

  verify-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen --group dev --extra saas
      - run: uv run pytest tests/saas/test_accepted_oci_recovery.py tests/saas/test_accepted_m165_clean_context.py --reruns 0 -q

  build-accepted-product:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Dream1216/omnigent' && github.ref == 'refs/heads/main' && inputs.policy_revision == github.sha && (inputs.phase == 'build' || inputs.phase == 'confirm-server')
    needs: verify-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.raw.outputs.artifact-id }}
      artifact-sha256: ${{ steps.raw.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen --extra saas
      - name: Authenticate accepted CI and original successful comparison steps
        if: inputs.phase == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m saas.scripts.accepted_oci_recovery prepare --root "$RUNNER_TEMP/accepted-raw"
          cp saas/scripts/accepted_oci_recovery.py "$RUNNER_TEMP/accepted_oci_recovery.py"
      - name: Authenticate retained failed parent and prove current frozen source on both architectures
        if: inputs.phase == 'confirm-server'
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m saas.scripts.accepted_m165_clean_context prepare --root "$RUNNER_TEMP/accepted-raw"
          mkdir "$RUNNER_TEMP/accepted-control"
          git archive "$GITHUB_SHA" saas | tar -x -C "$RUNNER_TEMP/accepted-control"
      - name: Checkout unchanged accepted business product
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.PRODUCT_REVISION }}
          persist-credentials: false
      - name: Verify product checkout and install its existing locked helpers
        run: |
          [[ "$(git rev-parse HEAD)" == "$PRODUCT_REVISION" ]]
          [[ -z "$(git status --porcelain)" ]]
          uv sync --frozen --extra saas
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: recovery-builder
      - name: Recover Server using its existing first-attempt build cache
        if: inputs.phase == 'build'
        id: server
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: server
          target: runtime
          attempt: "1"
      - name: Recover Host using its existing first-attempt build cache
        if: inputs.phase == 'build'
        id: host
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: host
          target: host
          attempt: "1"
      - name: Independently build only Server without cache for the clean retained first
        if: inputs.phase == 'confirm-server'
        id: independent-server
        uses: ./saas/actions/build-oci-candidate
        with:
          artifact: server
          target: runtime
          attempt: "2"
      - name: Stage actual OCI before any cleanup or inspection can fail
        if: inputs.phase == 'build'
        run: |
          mv "$RUNNER_TEMP/server-1.tar" "$RUNNER_TEMP/accepted-raw/"
          mv "$RUNNER_TEMP/host-1.tar" "$RUNNER_TEMP/accepted-raw/"
      - name: Preserve actual independent Server before any later inspection
        if: inputs.phase == 'confirm-server'
        run: mv "$RUNNER_TEMP/server-2.tar" "$RUNNER_TEMP/accepted-raw/"
      - name: Reclaim only this ephemeral builder cache before OCI inspection
        env:
          RECOVERY_BUILDER: ${{ steps.recovery-builder.outputs.name }}
        run: |
          [[ "$RECOVERY_BUILDER" =~ ^builder-[a-zA-Z0-9][a-zA-Z0-9_-]{1,90}$ ]]
          docker buildx prune --builder "$RECOVERY_BUILDER" --all --force
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Match actual four-platform bytes to original independent comparisons
        if: inputs.phase == 'build'
        id: compare
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run python "$RUNNER_TEMP/accepted_oci_recovery.py" verify --root "$RUNNER_TEMP/accepted-raw"
      - name: Confirm actual independent Server pair and unchanged historical Host pair
        if: inputs.phase == 'confirm-server'
        env:
          PYTHONPATH: ${{ runner.temp }}/accepted-control
        run: uv run python "$RUNNER_TEMP/accepted-control/saas/scripts/accepted_m165_clean_context.py" confirm --root "$RUNNER_TEMP/accepted-raw"
      - name: Preserve actual OCI before any fresh vulnerability scan
        id: raw
        if: always() && ((steps.server.outcome == 'success' && steps.host.outcome == 'success') || (inputs.phase == 'confirm-server' && steps.retained.outcome == 'success'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-raw-${{ env.PRODUCT_REVISION }}-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted-raw/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  scan-and-admit-same-oci:
    if: always() && !cancelled() && needs.verify-contract.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'Dream1216/omnigent' && github.ref == 'refs/heads/main' && inputs.policy_revision == github.sha && (needs.build-accepted-product.result == 'success' || inputs.phase == 'scan')
    needs: [verify-contract, build-accepted-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: ./saas/actions/runtime-evidence-context
        with:
          product-revision: ${{ env.PRODUCT_REVISION }}
          evidence-revision: d404ce0e80e5f5b10b9dd8dec8673fb02382f3ec
      - name: Download and independently recheck the same real raw checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_RUN: ${{ inputs.raw_run_id || github.run_id }}
          RAW_ID: ${{ inputs.raw_artifact_id || needs.build-accepted-product.outputs.artifact-id }}
          RAW_SHA: ${{ inputs.raw_artifact_sha256 || needs.build-accepted-product.outputs.artifact-sha256 }}
          COMPARISON_PROFILE: ${{ inputs.phase == 'confirm-server' && 'clean-M165-server' || inputs.comparison_profile }}
        run: |
          python -m saas.scripts.accepted_oci_recovery download --root "$RUNNER_TEMP/same-oci" --run-id "$RAW_RUN" --artifact-id "$RAW_ID" --sha256 "$RAW_SHA" --policy "$GITHUB_SHA" --comparison-profile "$COMPARISON_PROFILE"
      - name: Fresh scan and seal without rebuilding or relaxing any gate
        id: seal
        run: |
          python -m saas.scripts.scan_oci_candidates --image "server=$RUNNER_TEMP/same-oci/server-1.tar" --image "host=$RUNNER_TEMP/same-oci/host-1.tar" --output "$RUNNER_TEMP/same-oci/grype"
          python -m saas.scripts.oci_promotion seal --root "$RUNNER_TEMP/same-oci" --revision "$PRODUCT_REVISION" --source-date-epoch "$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
