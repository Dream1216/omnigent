name: SaaS N-1 merge gate

# Runs only trusted main-side policy and posts a dedicated commit status to the
# exact PR head. Candidate code is never checked out or executed here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [SaaS N-1 compatibility image]
    types: [requested, in_progress, completed]

permissions:
  contents: read

concurrency:
  group: saas-n1-merge-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          sparse-checkout: .github/actions/compat-smoke-saas-n1-gate
          persist-credentials: false

      - name: Resolve current PR head
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            PR="$EVENT_PR"
            EXPECTED_SHA="$EVENT_HEAD_SHA"
          else
            EXPECTED_SHA="$WORKFLOW_HEAD_SHA"
            PR=$(jq -r '.[0].number // empty' <<<"$WORKFLOW_PRS")
            if [[ -z "$PR" ]]; then
              SEARCH=$(gh api "search/issues?q=repo:$REPO+type:pr+state:open+sha:$EXPECTED_SHA")
              COUNT=$(jq '.items | length' <<<"$SEARCH")
              [[ "$COUNT" -eq 1 ]] || {
                echo "::error::workflow head must resolve to exactly one open PR"
                exit 1
              }
              PR=$(jq -r '.items[0].number' <<<"$SEARCH")
            fi
          fi

          META=$(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.state, .base.ref, .base.sha, .head.sha] | @tsv')
          IFS=$'\t' read -r STATE BASE_REF BASE_SHA SHA <<<"$META"
          [[ "$STATE" == "open" && "$BASE_REF" == "main" && \
             "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::resolved PR is not an open main-targeting PR"
            exit 1
          }
          [[ -z "$EXPECTED_SHA" || "$SHA" == "$EXPECTED_SHA" ]] || {
            echo "::error::workflow run no longer matches the current PR head"
            exit 1
          }
          echo "pr=$PR" >>"$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >>"$GITHUB_OUTPUT"
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"

      - name: Evaluate exact PostgreSQL N-1 authority
        id: gate
        if: >-
          github.event_name != 'workflow_run' ||
          github.event.action == 'completed'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
        run: bash .github/actions/compat-smoke-saas-n1-gate/evaluate.sh

      - name: Mark non-completed N-1 run pending
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.action != 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          SHA: ${{ steps.context.outputs.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.state, .base.ref, .base.sha, .head.sha] | @tsv')
          IFS=$'\t' read -r CURRENT_STATE CURRENT_BASE_REF CURRENT_BASE_SHA \
            CURRENT_HEAD_SHA <<<"$CURRENT"
          [[ "$CURRENT_STATE" == "open" && "$CURRENT_BASE_REF" == "main" && \
             "$CURRENT_BASE_SHA" == "$BASE_SHA" && "$CURRENT_HEAD_SHA" == "$SHA" ]] || {
            echo "::error::PR head or base changed before pending status"
            exit 1
          }
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=pending \
            -f context="SaaS N-1 Merge Ready" \
            -f target_url="$TARGET_URL" \
            -f description="PostgreSQL 16 N-1 verification is running" >/dev/null

      - name: Post exact-head gate status
        if: >-
          github.event_name != 'workflow_run' ||
          github.event.action == 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          SHA: ${{ steps.context.outputs.sha }}
          OUTCOME: ${{ steps.gate.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.state, .base.ref, .base.sha, .head.sha] | @tsv')
          IFS=$'\t' read -r CURRENT_STATE CURRENT_BASE_REF CURRENT_BASE_SHA \
            CURRENT_HEAD_SHA <<<"$CURRENT"
          [[ "$CURRENT_STATE" == "open" && "$CURRENT_BASE_REF" == "main" && \
             "$CURRENT_BASE_SHA" == "$BASE_SHA" && "$CURRENT_HEAD_SHA" == "$SHA" ]] || {
            echo "::error::PR head or base changed during gate evaluation"
            exit 1
          }
          if [[ "$OUTCOME" == "success" ]]; then
            STATE=success
            DESCRIPTION="trusted PostgreSQL 16 N-1 evidence accepted"
          else
            STATE=failure
            DESCRIPTION="trusted PostgreSQL 16 N-1 evidence missing or rejected"
          fi
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="SaaS N-1 Merge Ready" \
            -f target_url="$TARGET_URL" \
            -f description="$DESCRIPTION" >/dev/null
          [[ "$STATE" == "success" ]]
