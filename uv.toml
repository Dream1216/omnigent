# Fail loudly on a uv too old to honor the cooldown below: relative
# `exclude-newer` durations parse from 0.11, and the lockfile sentinel
# handling that keeps `uv sync --locked` stable landed in 0.11.8.
required-version = ">=0.11.8"

# Security floors for transitive dependencies present in the repository's
# all-extras/dev lock. Keep them here (rather than under [tool.uv]) because
# this repository uses uv.toml as the authoritative resolver configuration.
constraint-dependencies = [
    "msgpack>=1.2.3,<2",
    "pyasn1>=0.6.5,<0.7",
    "setuptools>=84.1.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.13,<22",
    "aiohttp>=3.14.4,<4",
    "graphql-core>=3.2.12,<3.3",
    "gitpython>=3.2.1,<4",
    "opentelemetry-api>=1.45.1,<2",
    "brotli>=1.2.1,<2",
    "filelock>=4.2.1,<5",
    "mlflow>=3.17.2,<4",
    "mlflow-skinny>=3.17.2,<4",
    "mlflow-tracing>=3.17.2,<4",
]

# Dependency cooldown: never resolve a distribution uploaded within the
# last 7 days, so a compromised or yanked release has a window to surface
# before it gets pinned. uv records the relative span in uv.lock (as
# `exclude-newer-span`) rather than a fixed date, so the pinned versions
# stay reproducible and `uv sync --locked` keeps passing; the cooldown is
# only re-applied when a resolution actually runs (`uv lock`, `--upgrade`,
# `--refresh`, or a dependency change).
exclude-newer = "P7D"

# Per-package cooldown exemptions (each scoped to one package, a fixed date
# just past its publish time, so the global P7D supply-chain cooldown still
# guards every other dependency):
# - cwsandbox: first-party CoreWeave SDK pinned to an exact, tested version
#   (the `cwsandbox` extra), published 2026-06-11. Drop once aged past P7D.
# - google-antigravity: the SDK the `antigravity` harness drives (the
#   `antigravity` extra in pyproject), published 2026-06-11. Drop once aged
#   past P7D.
# - nimble-python: the verified Agent API V2 1.2 contract release, required by
#   nimble_research for typed run fields. Drop once it has aged past P7D.
# - mlflow / mlflow-skinny / mlflow-tracing: cross-pinned 3.17.2 fixes the
#   FileStore trace path traversal (CVE-2026-53995). The common cutoff is
#   immediately after the last official 3.17.2 upload; no later train is admitted.
#   Drop once aged past P7D (2026-10-28).
# - pillow / certifi: fixed releases required by the production image scan
#   (GHSA-8g5g-8vmr-9782 / GHSA-6q48-6c7w-9gw2). Drop after P7D.
# - brotli: 1.2.1 fixes decoder corruption (GHSA-9v8h-qqgm-4m35).
#   Drop once aged past P7D (2026-10-29).
# - filelock: 4.2.1 fixes lock path/symlink attacks including CVE-2026-112940.
#   Drop once aged past P7D (2026-10-24).
# - virtualenv: 21.14.13 fixes bash prompt execution and temporary cache links.
#   Drop once aged past P7D (2026-10-29).
exclude-newer-package = { cwsandbox = "2026-06-12T00:00:00Z", google-antigravity = "2026-06-12T00:00:00Z", nimble-python = "2026-07-29T00:00:00Z", mlflow = "2026-10-21T02:08:46Z", mlflow-skinny = "2026-10-21T02:08:46Z", mlflow-tracing = "2026-10-21T02:08:46Z", pillow = "2026-10-21T00:00:00Z", certifi = "2026-10-21T00:00:00Z", brotli = "2026-10-22T14:00:13Z", filelock = "2026-10-17T16:48:15Z", virtualenv = "2026-10-22T20:10:17Z", pyasn1 = "2026-10-27T06:32:50Z" }
